 LSM_equipment.10.d: "Правительство [FROM.GetAdjective] запросило наше правительство на одобрение миссии по военному наблюдению в связи с нашим текущим конфликтом. Конечно, наше правительство не обязано соглашаться, но всегда можно получить выгоду от обмена между нашими нациями"
