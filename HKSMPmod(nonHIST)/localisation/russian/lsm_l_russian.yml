 d_day_preparation_tt: "\n§CDень D подготовки будет в разгаре, и следующие эффекты будут реализованы:§!\n\n§G+ Союзники-меньшие нации начнут стягивать свои войска по Европе, чтобы помочь при высадке§!\n§G+ Союзники-основные нации начнут подготовку морского вторжения§!\n§G+ Получить 300% бонусов к исследованию технологий по высадочным катерам§!\n§G+ Если в мире с игроками и в состоянии войны с Германией, ИИ [SOV.GetNameDef] будет уведомлён о Баграционе§!\n§R- Время подготовки морского вторжения увеличится до начала Дня D§!\n\nПосле §R120 дней§!, игроки США/Великобритания смогут уведомить каждого ИИ союзника о начале Дня D, после §R240 дней§! в противном случае, реальное время может изменяться в зависимости от инициатора/ситуации в войне, но §Rне будет§! позднее января 1944 года.\n\nВыбирайте осторожно."
 equipment_20_tt_a: "\n§YВся артиллерия§!:§G+200% Мягкая атака§! и §R-50% Прорыв§!\n§YВсе дивизии§!:§G+20% Координация§! и §R-6% Скорость усиления§!"
 equipment_20_tt_b: "\n§YВсе Огненные танки§!:§G+10%§! до §G+50%§! Бонусы от местности и §RУвеличение потерь опыта и уменьшение подбора по убыванию§!"
