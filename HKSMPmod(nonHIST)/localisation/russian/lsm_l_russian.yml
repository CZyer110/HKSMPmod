 aggression_rule_1tt: "\n§RЧтобы избежать раннего апокалипсиса, основные страны с этим национальным духом будут следовать следующим правилам:§!\n\n§C1. Как лидер фракции, они не будут заключать альянс с любой страной, находящейся в состоянии войны, до июня 1938 года или при мировом напряжении более 60%, если только они сами не находятся в войне или это не разрешено скриптом.§!\n\n§R2. Они не будут защищать нейтральные страны до июня 1937 года или при мировом напряжении более 30%.§!\n\n"
 aggression_rule_2tt: "\n§RЧтобы избежать раннего апокалипсиса, основные страны с этим национальным духом будут следовать следующим правилам:§!\n\n§C1. Как лидер фракции, они не будут заключать альянс с любой страной, находящейся в состоянии войны, до июня 1939 года или при мировом напряжении более 80%, если только они сами не находятся в войне или это не разрешено скриптом.§!\n\n§R2. Они не будут защищать нейтральные страны до июня 1938 года или при мировом напряжении более 40%.§!\n\n"
 aggression_rule_3tt: "\n§RЧтобы избежать раннего апокалипсиса, основные страны с этим национальным духом будут следовать следующим правилам:§!\n\n§C1. Как лидер фракции, они не будут заключать альянс с любой страной, находящейся в состоянии войны, пока мировое напряжение не достигнет 100%, если только они сами не находятся в войне или это не разрешено скриптом.§!\n\n§R2. Они не будут защищать нейтральные страны до января 1939 года или при мировом напряжении более 50%.§!\n\n"
