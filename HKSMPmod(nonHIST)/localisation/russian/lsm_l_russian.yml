 LSM_startup.77.t: "Возможности дружественного ИИ"
 LSM_startup.77.d: "Это событие позволяет выбрать полезность дружественного ИИ для Германии. Будет поддержан минимум необходимой логики; однако могут быть введены ограничения на некоторые аспекты их общей производительности.\n\nНаведите указатель на каждый вариант для подсказок."
 LSM_startup.78.d: "Это событие позволяет выбрать полезность дружественного ИИ для Советского Союза. Будет поддержан минимум необходимой логики; однако могут быть введены ограничения на некоторые аспекты их общей производительности.\n\nНаведите указатель на каждый вариант для подсказок."
 LSM_startup.79.d: "Это событие позволяет выбрать полезность дружественного ИИ для Франции. Будет поддержан минимум необходимой логики; однако могут быть введены ограничения на некоторые аспекты их общей производительности.\n\nНаведите указатель на каждый вариант для подсказок."
 LSM_startup.77.a: "Ослабить логику дружественного ИИ"
 LSM_startup.77.b: "Улучшить логику дружественного ИИ"
 LSM_startup.77.c: "Немного улучшить логику дружественного ИИ"
 LSM_startup.80.d: "Это событие позволяет выбрать полезность дружественного ИИ. Будет поддержан минимум необходимой логики; однако могут быть введены ограничения на некоторые аспекты их общей производительности.\n\nНаведите указатель на каждый вариант для подсказок."
 startup_76_tt_a: "\n\n§C-Франция останется относительно историчной в плане боевой мощи и промышленности§!"
 startup_76_tt_aa: "\n\n§GИИ в целом будет придерживаться своего поведения из первого варианта§!\nЗа исключением:\n§C— Вместо борьбы на территории континентальной Европы Союзники будут чаще отступать, как это происходило в истории.§!\n\n§RПредупреждение§! — Это §RМОЖЕТ НЕ§! упростить игру за Ось, поэтому поведение находится на стадии тестирования."
 startup_76_tt_c: "\n\n§RПредупреждение§!: Может значительно снизить эффективность Оси\n\n§C-Франция и балканские нации будут следовать более строго по обычной последовательности фокусов§!\n§C-Противостояние Барбароссе будет отключено для Советского Союза§!\n§C-Великобритания и Уинстон Черчилль не продолжат войну из Канады, если Великобритания капитулирует рано§!\n§C-Нормандский десант и некоторые другие события будут отложены на более поздние исторические даты§!\n§R-Дружественный ИИ больше не будет механически усиливать промышленность Германии через торговлю (событие об отмене полезности ИИ)§!\n§R-Швейцария не будет торговать золотом с Германией до начала Второй мировой войны§!"
 startup_76_tt_d: "\n\n§RПредупреждение§!: Может значительно снизить эффективность Оси\n\n§C-Франция/Балканы/Южноамериканские страны будут следовать более строго по обычной последовательности фокусов§!\n§C-Противостояние Барбароссе будет отключено для Советского Союза§!"
 startup_76_tt_e: "\n\n§C-Ослабить промышленную мощь Германии и Оси, а также отключить определённые взаимодействия между фракциями§!"
 startup_76_tt_b: "\n\n§C-Не будет ограничений для Франции и Балканских стран§!\n§C-Советский Союз может отомстить, если пакт Молотова-Риббентропа не был подписан после начала Второй мировой войны§!\n§C-Некоторые поведения союзников ИИ также будут изменены§!"
 LSM_startup_80_a_tt: "\n\n§R-ИИ может попытаться саботировать игрока§!"
 LSM_startup_80_b_tt: "\n\n§G+Игроки будут уведомлены о некоторых событиях§!\n§G+Игроки получат бонусы к гражданской экономике от ИИ, если поддерживается дружественное отношение§!"
 LSM_startup_77_a_tt: "\n\n§R-Поддержка фракционного усиления экономики будет отключена§!\n§R-Швейцарские торговые соглашения будут недоступны до определённой даты§!\n§R-Игроки не будут уведомляться о прогрессе технологий ИИ§!\n§R-Малые нации с массовыми мобилизациями будут развёртывать меньше войск§!\n§R-Взаимный обмен снаряжением между ИИ и игроками будет отключён§!\n§R-Игроки больше не смогут запрашивать лицензии заранее от не состоящих в фракции стран§R\n"
 LSM_startup_77_b_tt: "\n\n§G+Фракционное усиление экономики будет включено для потенциальных союзников и некоторых крупных стран§!\n§G+Игроки будут уведомлены о некоторых событиях§!"
 LSM_startup_77_c_tt: "\n\n§G+Фракционное усиление экономики будет включено для потенциальных союзников и некоторых крупных стран§!\n§G+Не будет введено никаких специальных эффектов§!"
 LSM_startup.80.b: "Стандартная логика дружественного ИИ"
 LSM_startup_77_d_tt: "\n\n§CНе будет введено никаких специальных эффектов для игроков или ИИ§!"
 LSM_startup_78_a_tt: "\n\n§R-Потенциальные союзники могут активно навредить вам§!\n§R-Фракционное усиление экономики будет отключено§!\n§R-Швейцарские торговые соглашения будут недоступны до определённой даты§!\n§R-Игроки не будут уведомляться о прогрессе технологий ИИ§!\n§R-Малые нации с массовыми мобилизациями будут развёртывать меньше войск§!\n§R-Взаимный обмен снаряжением между ИИ и игроками будет отключён§!\n§R-Игроки больше не смогут запрашивать лицензии заранее от не состоящих в фракции стран§R\n"
 LSM_startup_78_b_tt: "\n\n§G+Фракционное усиление экономики будет включено для потенциальных союзников и крупных стран§!\n§G+Игроки будут уведомлены о некоторых событиях§!\n§G+Потенциальные союзники могут попытаться не навредить вам§!"
