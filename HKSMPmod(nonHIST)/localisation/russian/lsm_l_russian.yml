 LSM_GER_SOV.99.d: "После нашего отступления после выхода восточных польских государств, Советский Союз быстро занял оставшиеся Балтийские страны, которые ранее находились под нашей защитой. Несмотря на то, что этот шаг мог показаться неожиданным, для Советского Союза это было вполне разумно, учитывая, что мы не в состоянии защитить те территории, которые они сами объявили своей сферой влияния.\n\nВозможно, всё, что мы можем сделать сейчас, это смириться с этим."
 LSM_GER_SOV.99.a: "Ничего особенного мы сделать не можем"
