 GER_soviet_military_exercises_LSM_desc: "Правительство [SOV.GetAdjective] сильно обеспокоено военной ситуацией у своего выдающегося соседа, [GER.GetNameDef], и, конечно же, желает только мира в Европе. Однако, учитывая дипломатическую позицию между правительствами [GER.GetAdjective] и [SOV.GetAdjective], вероятно, что §Cтолько пакт о ненападении§! между [SOV.GetNameDef] и [GER.GetNameDef] может заверить [SOV.GetLeader] в отсутствии поводов для беспокойства."
