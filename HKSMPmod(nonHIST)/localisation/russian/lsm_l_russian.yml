 lsm_news.3.t: "Саммит Американской Организации Договора"
 lsm_news.3.d: "Сегодня вечером [From.GetNameDef] выступил с совместным оборонным заявлением, направленным на противодействие нарастающей угрозе из Европы и Азии, а также на подготовку к возможному вторжению путём увеличения производства, строительства военных кораблей и проведения всеобщего призыва.\n\nМогучие флоты Старого Света уже направляются по напряжённым и протяжённым морским путям, вооружённые и готовые к решающему столкновению. А по другую сторону Атлантики миллионы солдат ждут своего часа ступить на землю Нового Света. С этого момента только верность долгу и непреклонное сопротивление иностранному империализму могут дать Америке шанс пережить этот беспощадный натиск."
 lsm_news.3.a: "Да хранит их Бог"
 lsm_news.3.b: "Вперёд, в Новый Свет!"
 lsm_news.3.c: "За демократию и свободу!"
 lsm_news.4.t: "[From.GetNonIdeologyName] пересекает Атлантику"
 lsm_news.4.d: "\"Один бой, одна воля, одна цель — победа любой ценой!\" — заявил [FROM.GetLeader], указывая на судостроительные верфи и заводы, где с максимальной точностью был составлен план по строительству десятков тысяч новых кораблей для пересечения Атлантики. Однако зрители задерживают дыхание при виде нового могучего линкора. Война между Старым и Новым Светом началась — но лишь время покажет, кто выйдет победителем."
 lsm_news.4.a: "Ну, удачи"
 lsm_news.4.b: "Вперёд, в Новый Свет!"
 lsm_news.5.t: "[From.GetNonIdeologyName] пересекает Тихий океан"
 lsm_news.5.d: "\"Один бой, одна воля, одна цель — победа любой ценой!\" — заявил [FROM.GetLeader], указывая на судостроительные верфи и заводы, где с максимальной точностью был составлен план по строительству десятков тысяч новых кораблей для пересечения Тихого океана. Однако зрители задерживают дыхание при виде новой мощной авианосной группировки. Ад вырвался наружу на островах и некогда спокойных водах, но лишь время покажет, кто выйдет победителем."
 lsm_news.5.a: "Ну, удачи"
 lsm_news.5.b: "Вперёд, в Новый Свет!"
 britain_surrender: "Лондонский договор"
 LSM_british_exodus: "Британский исход"
 LSM_british_migration: "Британская иммиграция"
 LSM_british_migration_2: "Иммиграционная политика Содружества"
 lsm_news.1.t: "Уинстон Черчилль объявил свой план"
 lsm_news.1.d: "Сегодня утром, в радиотрансляции из [ENG.Capital.GetCapitalVictoryPointName], премьер-министр Соединённого Королевства и Британской империи выступил с речью перед своими гражданами — перед теми, кто живёт на ныне покорённых островах, за морями и океанами, за бурями и метелями, в знойных пустынях и густых тропических лесах, перед каждым подданным необъятной империи. Мало кто запомнил его слова, но одна цитата врезалась в память: мы будем сражаться до конца, мы никогда не сдадимся!\n\nС этим британское правительство отступает в заморские территории — Канаду и Южную Африку, спасаясь от Европы в надежде продолжить войну за границей."
 lsm_news.1.a: "Куда бы я ни пошёл... повсюду вижу его лицо"
 lsm_news.1.b: "Будь ты проклят, премьер-министр Черчилль!"
 lsm_news.1.c: "Нам нужно подготовиться"
 lsm_news.2.t: "[FROM.GetLeader] объявил свой план"
 lsm_news.2.d: "Сегодня утром, из кабинета на Даунинг-стрит, премьер-министр Соединённого Королевства и Британской империи обратился к своим гражданам, объявив о капитуляции перед иностранными правительствами, включая сдачу большинства колоний и подданных, за исключением доминионов.\n\nВзамен Британии было дано обещание не вмешиваться в её политику, пока регулярно выплачиваются военные репарации. Это было горькое поражение для британского правительства, но Соединённое Королевство и её доминионы смогут выжить."
 lsm_news.2.a: "Да благословит короля Господь..."
 lsm_news.2.b: "Жалкое зрелище, но нам по нраву"
 lsm_news.2.c: "Демократия пала"
 LSM_ENG_churchill.1.t: "Мы будем сражаться до конца"
 LSM_ENG_churchill.1.d: "Мы никогда не сдадимся, и даже если этот остров падёт, наша Империя за морями, вооружённая и защищённая британским флотом, продолжит борьбу — пока в благой час по воле Господа Новый Свет не выступит на защиту и освобождение Старого."
 LSM_ENG_churchill.1.a: "Империя держится"
 LSM_ENG_churchill.1.b: "Мы потерпели поражение"
 LSM_ENG_churchill.10.t: "Британия обращается к нам"
 LSM_ENG_churchill.10.d: "С надвигающимся поражением Британии нашим гражданам предстоит столкнуться с ещё более тяжёлым испытанием. На пляжи, солдаты и моряки! Мы не сдадимся!"
 LSM_ENG_churchill.10.a: "За Империю"
 LSM_ENG_churchill.10.b: "За Империю"
 LSM_ENG_churchill.10.c: "Отвалите"
 LSM_ENG_churchill.20.t: "Британия приближается к нам"
 LSM_ENG_churchill.20.d: "С поражением Британии, нависшим над нашей судьбой, наши граждане должны подготовиться к ещё более жестокой борьбе. В пустыню и джунгли, друзья мои! Легендарная эпопея Африки ещё не началась!"
 LSM_ENG_churchill.20.a: "За Империю"
 LSM_ENG_churchill.20.b: "За Империю"
 LSM_ENG_churchill.20.c: "Отвали"
 LSM_ENG_churchill.30.t: "Британия приближается к нам"
 LSM_ENG_churchill.30.d: "С поражением Британии, нависшим над нашей судьбой, наши граждане должны подготовиться к ещё более жестокой борьбе. На острова, к побережью! Наше время настало!"
 LSM_ENG_churchill.30.a: "За Империю"
 LSM_ENG_churchill.30.b: "За Империю"
 LSM_ENG_churchill.30.c: "Отвали"
 LSM_ENG_churchill.40.t: "Британия приближается к нам"
 LSM_ENG_churchill.40.d: "С поражением Британии, нависшим над нашей судьбой, наши граждане должны подготовиться к ещё более жестокой борьбе. Индийский народ объединяется вдоль сильных рук наций Содружества!"
 LSM_ENG_churchill.40.a: "За Империю"
 LSM_ENG_churchill.40.b: "За Империю"
 LSM_ENG_churchill.40.c: "Отвали"
 LSM_ENG_churchill.50.t: "Британия приближается к нам"
 LSM_ENG_churchill.50.d: "С поражением Британии, нависшим над нашей судьбой, наши граждане должны подготовиться к ещё более жестокой борьбе. Эй, приятель! Ты что, спишь?! Пора засветиться, приятель!"
 LSM_ENG_churchill.50.a: "За Империю"
 LSM_ENG_churchill.50.b: "За Империю"
 LSM_ENG_churchill.50.c: "Отвали"
 LSM_ENG_churchill.60.t: "Британия приближается к нам"
 LSM_ENG_churchill.60.d: "Наш величайший союзник скоро падёт под злодейской тиранией Европы. Многие члены нашего выжившего кабинета предлагают нам сформировать Союз с разваливающейся Империей, который, возможно, выдержит испытания временем и даже переживёт эту тьму, чтобы однажды наши дети могли вернуться домой, чтобы однажды эта тень была отбита волей тех немногих, кто решил никогда не сдаваться."
 LSM_ENG_churchill.60.a: "Вместе к победе"
 LSM_ENG_churchill.60.b: "В конце концов, мы все равно пойдем разными путями"
 LSM_ENG_churchill.100.t: "Британия приближается к нам"
 LSM_ENG_churchill.100.d: "Сегодня утром мы получили сообщение от британского правительства, в котором выражено их желание сдать колонии, принадлежащие Империи, и отказаться от любых существующих союзов с нашими врагами. Принятие этого предложения освободит наши силы и облегчит бремя на наших гарнизонах, но мы также откажемся от всех претензий на оставшиеся государства на время."
 LSM_ENG_churchill.100.a: "Ну что, почему бы и нет?"
 LSM_ENG_churchill.100.b: "Либо всё, либо ничего"
 ENG_churchill_plan: "План Уинстона"
 lsm_news.1000.t: "Приказ 227"
 lsm_news.1000.d: "Ни шагу назад! - [SOV.GetLeader] обратился как к немногим, так и к многим, стоящим перед ним, с не меньшим, чем мучительный рычание, которое и он едва мог вытерпеть. Тревожные новости с передовой захлестнули его стол, с докладами о том, как [SOV.GetAdjective] армия распадается и стоит на грани краха.\n\nОн знал, [SOV.GetNameDef] знал, однако, что великое жертвоприношение должно быть принесено, что тысячи поглотят свой собственный поток крови в бездну отчаяния, под тем, что, возможно, стало величайшей угрозой в истории. И [SOV.GetLeader] знал, всей уверенностью своего сердца, что ни одна армия не является непобедимой."
 lsm_news.1000.a: "Удачи"
 lsm_news.1000.b: "Заблуждающийся дурак"
 lsm_news.1000.c: "Солдаты, в атаку!"
 lsm_news.200.t: "Тыл"
 lsm_news.200.d: "Тогда раздается шепот в темноте, слухи на ветру. Ложь, возможно! Или маска, когда слухи распространяются за пределы того, что когда-то было паутиной незначительных личностей, тех, кто преследует одну цель - свободу Британии, свободу демократического мира Европы!\n\nОккупанты понимают истину очень хорошо, ничто не ускользнуло от их зоркого взгляда, как будто свет Божий даровал им руководство на этом грешном пути - но для каждого луча света появляется слой тени.\n\nБритания никогда не сдается."
 lsm_news.200.a: "Тревожное развитие"
 lsm_news.200.b: "Посылайте армию!"
 lsm_news.200.c: "Бог благословит их"
 lsm_news.200.e: "Британия всегда будет"
 lsm_news.201.t: "Британия, пробудись!"
 lsm_news.201.d: "Я поднимаю тост, дамы и господа. Пусть эта дорогая земля, которую мы так любим, останется в достоинстве и свободе, пусть миры меняются и идут наперекосяк, пока будет хотя бы один голос, чтобы воззвать. Британия всегда будет, пока есть сельская дорога, где бы ни стоял маленький коттедж, рядом с полем зерна.\nБритания всегда будет, пока есть оживленная улица, где бы ни крутились колеса, миллион марширующих ног. Красный, белый и синий! Что это значит для вас? Несомненно, вы гордитесь этим, кричите об этом вслух, если Британия значит для вас так же много, как для меня."
 lsm_news.201.a: "Да будет мир"
 lsm_news.201.b: "Посылайте танки!"
 lsm_news.201.c: "Бог благословит нас всех!"
 lsm_news.201.e: "Британия, пробудись!"
 LSM_ENG_churchill.665.t: "Тишина перед бурей"
 LSM_ENG_churchill.665.d: "С частыми бунтами и вспышками насилия в Западной Европе, все более настораживает возможность крупного восстания в ближайшем будущем. Хотя эта проблема, скорее всего, не повлияет на наш текущий военный план в других регионах, теперь это факт, что мы должны действовать быстро, чтобы обеспечить нашу безопасность в этом регионе, иначе все наши усилия в этой войне могут рухнуть за ночь."
 LSM_ENG_churchill.665.a: "Посылайте армию"
 LSM_ENG_churchill.665.b: "Что могут сделать эти крестьяне?"
 LSM_ENG_churchill.666.t: "Британия, восстань!"
 LSM_ENG_churchill.666.d: "Иногда я вспоминаю лица своих тогда... ух, молодых племянников, тех, кто пожертвовал собой, чтобы купить время для бегства нашего кабинета. Честно говоря, я едва помню, как они выглядели... Но я помню их улыбки, полные надежды, уверенности и, возможно, с оттенком нашего стоицизма, который победил с течением времени. И я знаю, всем сердцем, что эти лучшие молодые люди не раздумывали, прежде чем броситься в эти чертовы кровавые бои... они точно не раздумывали."
 LSM_ENG_churchill.666.a: "Никогда не сдавайся!"
 LSM_ENG_churchill.667.t: "Милитаристическое сопротивление уничтожено"
 LSM_ENG_churchill.667.d: "После долгого периода постоянных столкновений с милициями в Британии и во Франции, нам наконец-то удалось уничтожить корень проблемы и полностью уничтожить всякое возможное сопротивление нашей оккупации. Конечно, это не обошлось без потерь. Фабрики разрушены, тысячи британцев подвергнуты суду или расстрелу, многие другие были замучены голодом, прежде чем их повесили для того, чтобы народ понял свое место в мире. Тем не менее, война сопротивления в Западной Европе закончена."
 LSM_ENG_churchill.667.a: "Наконец-то немного покоя..."
 LSM_ENG_churchill.668.t: "Милитаристическое сопротивление уничтожено"
 LSM_ENG_churchill.668.d: "О, как я проливаю слезы грусти! Мои родные больше не восстанут, река стала красной от крови, этот скорбь закрасила наше небо в серый цвет! О, Британия, мы никогда не сдадимся! Мы никогда не отступим, мы всегда будем сражаться! О Британия, моя прекрасная родина, о Британия, моя прекрасная мечта. Я встречу тебя там, друзья мои на небесах, ибо я последую за вами, на этом пути к освобождению!"
 LSM_ENG_churchill.668.a: "Британия, я вернусь!"
 LSM_new_world_diplomacy.5.t: "Корейская Гражданская Война"
 LSM_new_world_diplomacy.5.d: "Настало время, товарищи, разорвать старые оковы, наложенные на нас злыми империалистами мира! За нами собирается сила социалистического братства, те, кто выразил единственную цель — чтобы наш полуостров оставался объединённым и процветающим. Товарищ, время пришло! Война!"
 LSM_new_world_diplomacy.5.a: "Война!!"
