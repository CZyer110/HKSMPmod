 anti_soviet_separatism_0: "Националистический анти-русский сепаратизм"
 anti_soviet_separatism_0_desc: "Население этого региона стало настороженно относиться к [SOV.GetAdjective] режиму, а их недавняя реинтеграция в состав [SOV.GetNameDef] стала неприятным процессом, вызвавшим сопротивление со стороны местных жителей.\n\n§CЭто государство будет автоматически реинтегрировано в Советский Союз, как только сепаратизм ослабнет, став частью [SOV.GetNameDef], если оно ранее не было им заявлено.§!"
 SOV_recovery_from_the_shock: "Восстановление после первоначального недовольства"
 SOV_recovery_from_the_shock_desc: "Некоторые сектора населения стали поддерживать сепаратистские настроения в разных интегрированных СССР Восточной Европы из-за первоначальной позиции [SOV.GetAdjective] армии и их способности защищать население от захватчиков. Со временем доверие может быть восстановлено, когда они организуют сопротивление текущей агрессии.\n\n§C[SOV.GetNameDef] будет получать 1% стабильности и 1% поддержку войны ежемесячно, чтобы компенсировать текущие потери доверия.§!"
 anti_soviet_separatism_3: "Неистовый националистический анти-русский сепаратизм"
 anti_soviet_separatism_2: "Значительный националистический анти-русский сепаратизм"
 anti_soviet_separatism_2a: "Умеренный националистический анти-русский сепаратизм"
 anti_soviet_separatism_1: "Слабый националистический анти-русский сепаратизм"
 pro_soviet_sentiment_1: "Идеологические опоры правительства"
 anti_soviet_separatism_3_desc: "Армия [SOV.GetAdjective] плохо охраняла эти территории или даже относилась к населению как к чуждым, не заслуживающим защиты. В результате распространился неистовый сепаратизм среди местных националистов в пользу немецких агрессоров.\n\n§RЭто неистовое недоверие вызвало потерю 1% стабильности и 1% поддержка войны.§!"
 anti_soviet_separatism_2_desc: "Армия [SOV.GetAdjective] отступила и оставила эти территории без значительного сопротивления. В результате значительный сепаратизм среди местных националистов поднялся в поддержку немецких агрессоров.\n\n§RЭто значительное недоверие вызвало потерю 1% стабильности и 1% поддержка войны.§!"
 anti_soviet_separatism_2a_desc: "Несмотря на определённое сопротивление, армия [SOV.GetAdjective] отступила и оставила эти территории без эффективной защиты. В результате умеренный сепаратизм среди местных националистов возник в поддержку немецких агрессоров."
 anti_soviet_separatism_1_desc: "Армия [SOV.GetAdjective] была вынуждена отступить из этих регионов из-за обстоятельств войны. Несмотря на то что сепаратистские настроения присутствуют в этих районах, сильное присутствие советской армии укрепило население и предотвратило массовый сепаратизм."
 pro_soviet_sentiment_1_desc: "Армия [SOV.GetAdjective] защищала эти территории до последнего человека. Их отвага вдохновила население подняться с оружием против захватчиков.\n\n§RЗа этот пример храбрости [SOV.GetNameDef] получает 1% поддержка войны.§!"
