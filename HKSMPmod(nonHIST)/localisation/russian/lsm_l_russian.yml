 LSM_equipment.9.d: "Наш ценный союзник, [FROM.GetNameDef], организовал специальную военную группу, чтобы присоединиться к нашим вооружённым силам и сражаться на передовой."
 LSM_equipment.11.t: "Технологический прогресс от [FROM.GetNameDef]"
 LSM_equipment.11.d: "[FROM.GetNameDef] уведомляет нас, что они завершили исследование великолепной технологии, которой мы ещё не обладаем, предлагая воспользоваться этим достижением для согласования научных интересов между нашими странами."
