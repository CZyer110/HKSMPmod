 LSM_neutrality_idea_desc: "Эти страны будут изо всех сил стремиться сохранить нейтралитет и не вмешиваться в текущий конфликт. Они откажутся от нейтральной позиции только после окончания войны, если не будут §Rатакованы§!, если их §Yнейтралитет не будет соблюдён§!, или если станет очевидно, что в Европе установлена §Gгегемония§!.\n\n§GСерьёзно, не нападай на нейтральные европейские страны в историческом режиме, если не хочешь, чтобы остальные встали на сторону врага.§!"
