 d_day_launch_tt_a: "§RИз-за недостаточной подготовки, этот поспешно и насильно осуществлённый план даст меньший немедленный бонус из-за отсутствия координации между союзниками§!\nДайте союзникам хотя бы 180 дней для получения полного эффекта бонусов Дня D."
