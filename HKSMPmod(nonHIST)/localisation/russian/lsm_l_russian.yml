 LSM_equipment.20.t: "Последнее сопротивление"
 LSM_equipment.20.d: "[JAP.GetNameDef] запустило смелую кампанию, используя подрывные мины, когда их солдаты бросались на наши машины в смертельных атаках, используя хаос на передовой в свою пользу.\n\nВ связи с растущими потерями, высшее командование не имело выбора, кроме как сосредоточить усилия на совершенствовании самых важных оружий на поле боя, надеясь спасти больше жизней, чем мы потеряли."
