 LSM_equipment.21.t: "[CAN.GetNameDef] захватывает Ньюфаундленд"
 LSM_equipment.21.d: "Этим утром канадская армия переместилась для обеспечения наших территорий в Ньюфаундленде в рамках политики защиты канадских и британских граждан, ищущих убежище от политического беспорядка в [ENG.GetNameDef]. Их предательский поступок был совершен в момент нашей слабости, когда наше внимание было сосредоточено на внутренней политической борьбе."
 LSM_equipment.21.a: "Что ж, так бывает"
 LSM_equipment.21.b: "Они обязаны своим существованием нам!"
