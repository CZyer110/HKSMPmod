 LSM_GER_SOV.200.t: "Предупреждение от Генерального штаба"
 LSM_GER_SOV.200.d: "Обеспокоенный текущей дипломатической ситуацией, Генеральный штаб сегодня представил [GER.GetLeader] предложение, сопроводив его предупреждением о возможности войны на два фронта, в случае если [SOV.GetNameDef] может стать потенциально враждебной силой. Конечно, хотя их беспокойство не лишено оснований, ясно, что [SOV.GetNameDef] в данный момент не в состоянии вести войну; таким образом, вполне возможно, что их дипломатическая позиция может оказаться полной уловкой.\n\nОднако, учитывая, что наши цели могут совпасть на данный момент, стоит рассмотреть возможность заключения договора о ненападении между двумя государствами как наилучший вариант."
 LSM_GER_SOV.200.a: "Почему бы не сосредоточиться на войне?"
 LSM_GER_SOV.200.c: "У нас есть другие обязательства"
 LSM_GER_SOV.200.b: "Что могут эти славяне?"
