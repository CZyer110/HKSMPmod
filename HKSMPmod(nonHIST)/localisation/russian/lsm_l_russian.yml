 ROM_oil_for_economic_investment: "Обмен нефти на экономические инвестиции"
 ROM_oil_for_economic_investment_desc: "Тщательные разведывательные работы в Мунтении пришли к выводу, что только наш германский союзник может обладать необходимым оборудованием и технологиями для разработки и извлечения из почвы её максимального потенциала. Взамен, возможно, мы сможем попросить Германию о значительных инвестициях в промышленность для дальнейшего укрепления нашей экономики."
 ROM_GER_economic_development: "Инвестиции в Румынию"
 ROM_ROM_economic_development: "Инвестиции от Германии"
 LSM_equipment.24.t: "Предложение от Румынии"
 LSM_equipment.24.d: "Румыния предложила нам полный доступ к нефтяным запасам в Мунтении в обмен на экономическую поддержку и промышленное инвестирование. Конечно, Германия не обязана откликаться на подобное требование, но это может стать настоящим благом для нас."
 LSM_equipment.24.a: "Согласиться на предложение"
 LSM_equipment.24.b: "Их требования неуместны"
 LSM_equipment.25.t: "Германия принимает предложение"
 LSM_equipment.25.d: "Признав, что их выгоды перевешивают затраты, [GER.GetAdjective] правительство приняло наше предложение с радушием. Эра процветания для Румынии может по-настоящему начаться."
 LSM_equipment.25.a: "Вместе за победу"
 LSM_equipment.26.t: "Германия отклоняет предложение"
 LSM_equipment.26.d: "Признав, что их затраты перевешивают выгоды, [GER.GetAdjective] правительство отклонило наше предложение без всяких раздумий. Процветание Румынии, возможно, придется подождать."
 LSM_equipment.26.a: "Упущенная возможность"
 ROM_oil_for_economic_investment_tech: "Румынско-германский технологический обмен"
 GER_ROM_dev_tt: "§CСтроительный проект для Германии начнется в течение следующих 180 дней, после завершения которого Румыния получит 4 гражданских завода и 4 военных завода.§!"
 LSM_equipment.27.t: "Завершение румынско-германского строительного проекта"
 LSM_equipment.27.d: "Вместе за победу"
 LSM_equipment.27.a: "Вместе к Победе!"
 LSM_US_guarantee: "Англо-американские демократические ценности"
 LSM_US_guarantee_desc: "Демократические Соединённые Штаты под руководством §CФранклина Д. Рузвельта§! могут вмешаться, чтобы поддержать демократическую Британию в случае войны, если Британским островам будет угрожать прямое нападение.\n\n§RМожно отключить в правилах игры§!"
 AI_FRA_SOV_HT_licensing: "Совместная разработка бронетехники с [SOV.GetNameDef]"
 LSM_startup.82.aa: "Новый тестовый билд 2"
 LSM_startup_82_a_tt: "Много пехоты, высокая агрессивность.\n\n§CВозможно, это перспективная тестовая сборка§!\n\n§GСделай всё, что сможешь.§!"
 LSM_startup_82_aa_tt: "Много пехоты, высокая агрессивность, но меньше авиации по сравнению с другой сборкой.\n\n§CВозможно, это перспективная тестовая сборка§!\n\n§GСделай всё, что сможешь.§!"