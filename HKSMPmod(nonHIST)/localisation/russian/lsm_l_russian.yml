 LSM_new_world_diplomacy.14.t: "Маленькое пограничное столкновение с Японией"
 LSM_new_world_diplomacy.14.d: "Отчёт показал, что японская армия увеличила своё присутствие на наших границах на Дальнем Востоке. Настоятельно рекомендуется следить за ситуацией, чтобы подготовиться к возможному вторжению со стороны Японской Империи, чтобы наш более слабый фланг не был использован в моменты уязвимости."
 LSM_new_world_diplomacy.14.a: "Отправить больше войск в регион"
 LSM_new_world_diplomacy_14_a_tt: "§CЦепное событие для конфликта на границе Халхин-Гол, но я ещё не завершил его.§!\n\n§RИмейте в виду, что вам всё равно следует разместить войска против Японии, на случай если я забуду обновить этот тултип. Например, §C8 дивизий в Владивостоке§! §Rбудет достаточно.§!"
