 endsieg_decision: "Окончательная победа"
 endsieg_decision_desc: "Закалённые в великих уроках истории, воспитанные в духе национал-социализма, с примером наших отцов перед глазами, мы принимаем этот бой за существование. В конце концов, он откроет нам путь в будущее. С таким Фюрером, как у нас, и с таким народом, каким мы являемся и всегда будем, кто сможет усомниться в нашей победе? Что мы завоевали в первой половине этой войны доблестью, мы должны отстоять упорством во второй. Мы сделаем это с полной решимостью. Среди нас нет никого, кто не знал бы, за что мы сражаемся."
