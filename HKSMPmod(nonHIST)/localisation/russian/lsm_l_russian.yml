 lsm_news.1114.t: "Операция Берлиносса"
 lsm_news.1114.d: "Сегодня утром, под непосредственным командованием [SOV.GetLeader], была начата операция Берлиносса по границе [SOV.GetAdjective]-[GER.GetAdjective].\n\n В официальном заявлении о начале войны [SOV.GetAdjective] правительство изложило три ключевых пункта на пути к миру, подчёркивая капитуляцию центральноевропейской угрозы, полную демилитаризацию, а также освобождение пролетариата по всей Европе.\n\nС вступлением [SOV.GetNameDef] во Вторую мировую войну, конец войны может быть ближе, чем когда-либо."
 lsm_news.1114.a: "За освобождение Европы!"
 lsm_news.1114.b: "Пусть война закончится наконец."
 every_man_a_soldier: "Каждый человек — солдат"
 every_man_a_soldier_desc: "Время нужды, каждый человек должен бороться, будь то палка, камень или даже голые кулаки. Время борьбы, каждый человек будет сражаться до последнего дыхания!"
 a_society_at_war: "Общество на войне"
 a_society_at_war_desc: "Время нужды, даже дети должны сражаться, будь то палка, камень или даже голые кулаки. Время борьбы, каждый будет сражаться до последнего дыхания!"
 LSM_equipment.22.t: "Страна в войне!"
 LSM_equipment.22.d: "Китай подвергся нападению, её суверенитет и свобода находятся под угрозой тирании Японии. У нас мало времени на мобилизацию для столкновения, и мы должны решить, какой путь выбрать для Китая.\n\nЛи Цзунжэнь, архитектор нашей обороны, предлагает радикальную социальную мобилизацию для усиления нашего производства вооружений, в то время как видение генералиссимуса — реформировать наши бюрократические меры для усиления армии."
