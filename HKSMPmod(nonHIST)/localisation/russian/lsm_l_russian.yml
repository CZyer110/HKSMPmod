 USA_tora_tora_tora_idea: "Лима Чарли! Лима Дельта!"
 USA_tora_tora_tora_idea_desc: "Соединённые Штаты Америки взяли инициативу в войне на Тихом океане, полностью воспользовавшись неподготовленностью Японии для выполнения серии атак по островам."
 lsm_news.1115.t: "Лима Чарли! Лима Дельта!"
 lsm_news.1115.d: "С флотами Японской Империи, теперь в полной готовности для борьбы с Британией, Соединённые Штаты Америки взяли инициативу, чтобы обострить войну на Тихом океане, используя неподготовленность Японии для выполнения серии атак по региону. Несмотря на ослабевающую поддержку войны на домашнем фронте, президент [USA.GetLeader] призвал к национальному единству и сплочению против растущей угрозы экстремизма как из Европы, так и из Азии.\n\nДальнейших обсуждений не будет, никаких дебатов — Соединённые Штаты Америки будут действовать всей своей мощью против тех злодеев, которые угрожают демократии!"
 lsm_news.1115.a: "Предательство!"
 lsm_news.1115.b: "И вот оно начинается."
 LSM_new_world_diplomacy.12.t: "Война в Азии и на Тихом океане"
 LSM_new_world_diplomacy.12.d: "Японская Империя объявила войну Британии, угрожая суверенитету нашей демократической крепости в Европе. Военное ведомство представило президенту план войны против Японии, который был подготовлен военным планом в качестве резервного на случай введения чрезвычайного положения."
 LSM_new_world_diplomacy.12.a: "Вмешательство в Тихом океане"
 LSM_new_world_diplomacy.12.b: "Не наша проблема"
