 LSM_the_final_push: "Endsieg - Последний рывок"
 LSM_the_final_push_desc: "Одна последняя битва, один последний год. Вперёд, к победе!!!"
 LSM_the_final_push_success: "Endsieg - Победа [Root.GetFactionName]"
 LSM_the_final_push_failure: "Endsieg - Победа [GER.GetFactionName]"
 LSM_the_final_push_success_desc: "Немцы всё ещё сопротивляются российским войскам в некоторых местах, но если они продолжат это делать после полуночи, они лишатся защиты законов войны и будут атакованы с всех сторон союзными войсками. В конце концов, почти весь мир объединился против злоумышленников, которые теперь лежат перед нами!"
 LSM_the_final_push_failure_desc: "Несмотря на наши усилия, немецкая военная машина не была сломана. Однако эти злодеи никогда не уйдут от правосудия. Мы должны двигаться вперёд, если хотим обеспечить окончательную победу!"
 LSM_the_final_push_failure_GER: "Поражение в Второй мировой войне"
 LSM_the_final_push_failure_GER_desc: "Здесь, в Берлине, где была задумана война уничтожения и откуда она была развязана, и куда она вернулась с полной силой разрушения, мы планировали отметить этот день совместно с другими. Прошу всех немцев молчаливо почтить память жертв войны и жертв национал-социализма. Где бы ни были ваши корни, найдите время вспомнить о ваших воспоминаниях, воспоминаниях вашей семьи, истории страны, в которой мы все живём. Подумайте, что освобождение значит для вашей жизни и ваших поступков."
 LSM_the_final_push_success_GER: "Наша окончательная победа под руководством [GER.GetLeader]"
 LSM_the_final_push_success_GER_desc: "Итак, я ожидаю, что каждый немец выполнит свой долг до конца, и что он будет готов принести на себя все жертвы, которые ему предстоит сделать; я ожидаю, что каждый здоровый немец будет сражаться, не заботясь о своей безопасности; я ожидаю, что больные и слабые или те, кто не могут служить в армии, будут работать с последними силами; я ожидаю, что горожане будут ковать оружие для этой борьбы, а фермеры будут поставлять хлеб для солдат и рабочих этой борьбы, накладывая ограничения на себя; я ожидаю, что все женщины и девушки продолжат поддерживать эту борьбу с величайшим фанатизмом."
 endsieg_idea: "Endsieg - Окончательная победа"
 endsieg_idea_desc: "Я спрашиваю вас: хотите ли вы тотальную войну?! Хотите ли вы её, если нужно, более тотальную и радикальную, чем мы можем себе представить?! Ну, народ, встань, и штормуй, прорвися! \n\n§RПоложительный результат для [GER.GetNameDef] по завершению Endsieg значительно повысит мораль Германии!§!"
 LSM_victory_in_europe: "Победа в Европе"
 LSM_victory_in_europe_desc: "Немецкая война подошла к концу. После лет интенсивной подготовки Германия обрушилась на Польшу в начале сентября 1939 года; и, в исполнение нашего гаранта для Польши и в соглашении с Французской Республикой, Великобританией, Британской Империей и Содружеством наций, объявила войну этой чудовищной агрессии. После того как храбрая Франция была побеждена, мы, с этого острова и из нашей объединённой Империи, вели борьбу в одиночку целый год, пока к нам не присоединились военные силы Советской России, а позже — подавляющая мощь и ресурсы Соединённых Штатов Америки."
