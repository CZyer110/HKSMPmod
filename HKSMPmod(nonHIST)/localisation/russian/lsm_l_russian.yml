 LSM_new_world_diplomacy.1.t: "Часы тьмы"
 LSM_new_world_diplomacy.1.d: "Тьма одержала верх во всех уголках мира. Столкнувшись с нехваткой вариантов, лидеры стран Американского континента собрались для обсуждения общей оборонной стратегии. Время на исходе, мы должны действовать немедленно."
