 lsm_news.1112.t: "Начало конца?"
 lsm_news.1112.d: "Сегодня утром лидеры ведущих стран собрались без присутствия §R[FROM.GetNameDef]§!, обсуждая растущее напряжение, вызванное одной нацией в Европе, и возможность грядущей мировой войны, а также возможность международных усилий по сдерживанию надвигающейся угрозы.\n\nХотя подробности ещё неизвестны, ни в одном парламенте не прозвучало осуждения в адрес их глав государства по поводу их отношения к [FROM.GetNameDef], которое уже распространило своё влияние по Европе и всему миру."
 lsm_news.1112.a: "Так тому и быть."
 lsm_news.1112_a_tt: "Вы вызвали слишком много мирового напряжения и угрожали суверенитету Европы, вынудив другие нации объединиться под одним знаменем для сдерживания растущей угрозы.\nТеперь наслаждайтесь вашей игрой в Рагнарёк."
 lsm_news.1112.b: "За защиту мировой свободы."
 lsm_news.1112.c: "Вот оно, растущее напряжение..."
