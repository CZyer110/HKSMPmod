l_russian:
 ITA_divisioni_alpine_tt: "\n§CКак только реформы будут внедрены, альпийская элита будет интегрирована в нашу школу мысли для всех будущих войн.§!"
 ITA_second_italo_ethiopian_war_army_bonus: "Вторая итало-эфиопская война"
 ITA_second_italo_ethiopian_war_army_bonus_desc: "С нарастающим конфликтом в Восточной Африке, который, похоже, не имеет окончательного разрешения, вполне естественно, что итальянское правительство не видит иных вариантов, кроме как призвать высшее военное командование усилить давление на военное наступление."
 ITA_exchange: "Обмененные африканские территории"
 ITA_negotiate_with_ethiopia: "Восточная Африка за военнопленных"
 warning_about_defeat_tt:0 "§RПоражение в Эфиопии значительно повлияет на процесс развития военной и промышленной отрасли и затормозит наши армейские реформы как минимум на один-два года. \n\n§!"
 LSM_technological_advance_idea: "Быстрое технологическое развитие"
 ITA_reforming_italy_armor: "Реорганизация производства бронетехники"
 ITA_reforming_italy_armor_desc: "В то время как наши производственные линии реорганизуются, нам следует ожидать значительной потери в объеме производства, но это необходимая жертва. Только после этого мы сможем надеяться догнать мировые стандарты в производстве бронетехники."
 ITA_reforming_italy_armor2: "Реорганизованная тяжелая военная промышленность"
 ITA_reforming_italy_armor2_desc: "Теперь, когда наши производственные линии улучшены, начали появляться новые фирмы мирового класса, которые поддержат нашу производственную мощь на фоне растущей напряженности в мире."
 ITA_better_stronger_gun: "Производители артиллерии под контролем"
 ITA_better_stronger_gun_desc: "Наше поражение в Эфиопии показало, где мы были слабы, одним из таких мест была артиллерия. Наши новые политики вступят в силу немедленно, чтобы повысить наш огромный потенциал в этой ключевой отрасли."
 ITA_better_stronger_gun1: "Улучшенные тяжелые боеприпасы"
 ITA_better_stronger_gun1a: "Улучшенное производство артиллерии"
 ITA_better_stronger_gun1_desc: "Качество — это качество, и ничего меньшее — мы победим наших противников превосходным инженерным мастерством."
 ITA_better_stronger_gun1a_desc: "Количество — это тоже качество — мы задавим наших противников превосходным числом."
 ITA_purge_leadership: "Чистка в руководстве"
 ITA_purge_leadership_desc: "Наши вооруженные силы сейчас проходят через обширную проверку с надеждой, что, как только мы восстановимся от этой ошибки, сможем компенсировать недостатки предыдущего руководства, которое допустило их из-за своей некомпетентности."
 ITA_reforming_the_mountaineer: "Реформа наших спецназовцев"
 ITA_reforming_the_mountaineer_desc: "Наши спецназовцы пройдут новую строгую программу подготовки, чтобы стать элитой, намного сильнее, чем при прежнем руководстве. Мы должны переписать нашу ошибку и оставить наследие в новом свете."
 ITA_a_meeting_at_the_high_table: "От поражения в Эфиопии..."
 ITA_a_meeting_at_the_high_table_desc: "Каждое поражение горько, но наше было унизительным. Нас ждет долгий путь."
 ITA_a_meeting_at_the_high_table2: "...к высокому столу в Риме"
 ITA_a_meeting_at_the_high_table2_desc: "Под руководством [ITA.GetLeader] совет собирается снова, надеясь найти ошибки, которые помешали нашему успеху в Эфиопии."
 ITA_a_meeting_at_the_high_table3: "Обновленная решимость"
 ITA_a_meeting_at_the_high_table3_desc: "Перед нами долгий путь, но мы знаем, что нужно делать. Нужно очистить наше руководство от дураков, улучшить промышленность и укрепить самую элитную силу, пока пыль не осела и не поглотила наши усилия."
 ITA_a_meeting_at_the_high_table4: "Кульминация усилий"
 ITA_a_meeting_at_the_high_table4_desc: "Мы прошли далеко, и теперь нам не стыдно за наше поражение. Это был урок, который сделал нас сильнее. [ITA.GetAdjective] армия стала гораздо более могущественной, поддерживаемой превосходной промышленностью и инженерией. Эта победа — результат нашей решимости."
 ITA_the_end_of_fiat: "Катастрофический исход дуополии Fiat-Ansaldo"
 ITA_the_end_of_fiat_desc: "Мы снова оцениваем деятельность Fiat и Ansaldo. На этот раз мы разрушили сопротивление изменениям и развитию, которое эти компании противопоставляли в стремлении сохранить свою прибыльность. Урон может быть колоссальным, но мы уверены, что наша экономика восстановится и станет сильнее, чем раньше."
 ITA_a_new_ansaldo: "Свержение замка"
 ITA_a_new_ansaldo_desc: "Ansaldo имеет гораздо больше потенциала, чем они думали. Теперь, когда они оказались в опасной ситуации и больше не могут сопротивляться нашему давлению, ясно, что им предстоит подчиниться нашей воле. Пришло время поставить эту компанию под новое руководство, возможно, напрямую под наше военное командование."
 ITA_army_primacy_bba_b:0 "[GetArmyPrimacyName]"
 ITA_army_primacy_bba_b_default:0 "Превосходство армии"
 ITA_army_primacy_bba_b_alt:0 "Еще одно поражение в Эфиопии"
 ITA_army_primacy_bba_b_desc:0 "[GetArmyPrimacyDesc]"
 ITA_army_primacy_bba_b_desc_default:0 "В конечном итоге, война выигрывается тем, что солдаты отправляются на землю врага и захватывают необходимые для войны ресурсы. Хотя флот и авиация несомненно полезны, именно армия выиграет войну."
 ITA_army_primacy_bba_b_desc_alt:0 "Все теперь понимают, что войну в конце концов выиграет армия, а не флот, не авиация и не даже производственная фронт. Каждая война нуждается в смелых и решительных людях, но оказалось, что мы даже не смогли сделать этого."
 ITA_preserve_army_traditions_b:0 "[GetPreserveArmyName]"
 ITA_preserve_army_traditions_b_default:0 "Сохранение традиций армии"
 ITA_preserve_army_traditions_b_alt:0 "Одна традиция, пересмотр и реформа"
 ITA_preserve_army_traditions_b_desc:0 "[GetPreserveArmyDesc]"
 ITA_preserve_army_traditions_b_desc_default:0 "В эти дни ходит множество идей о новых способах ведения войны. Хотя некоторые из них, вероятно, имеют определённые достоинства, основа успешной армии не менялась со времён Цезаря: дисциплина, личная храбрость и способное руководство."
 ITA_preserve_army_traditions_b_desc_alt:0 "Несмотря на наше поражение, в начале этого конфликта нам всё-таки удалось добиться успехов, так как враг был слаб и легко отбивался. Многие скажут, что нам нужно искать новые пути и исследовать потенциал нашей армии, но основа любой успешной армии никогда не менялась со времён Цезаря: дисциплина, личная храбрость и способное руководство."
 ITA_preserve_army_traditions_re_b_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ARMY_ORG$: §G+15.0%§! \n$MODIFIER_COMMAND_POWER_GAIN_MULT$: §G+15.0%§! \n\n"
 ITA_a_bandits_war_b:0 "[GetBanditName]"
 ITA_a_bandits_war_b_default:0 "Война с бандитами"
 ITA_a_bandits_war_b_alt:0 "Ищем новый путь"
 ITA_a_bandits_war_b_desc:0 "[GetBanditDesc]"
 ITA_a_bandits_war_b_desc_default:0 "Старые способы ведения войны должны были умереть в траншеях на Исонцо. Некоторые из наших старых генералов всё ещё считают, что войну можно выиграть, отправив массы солдат на мясорубку. Мы знаем лучше: современная война выигрывается быстрыми маневрами и гибкими структурами, которые могут быстро реагировать. Мы должны подготовить нашу армию к такому виду войны."
 ITA_a_bandits_war_b_desc_alt:0 "У ворот Аддис-Аббы мы узнали, что успешная армия в этой эпохе нуждается не только в старой и надёжной пехоте. Наше поражение было горьким, но теперь мы знаем гораздо лучше: современная война выигрывается быстрыми маневрами и гибкими структурами, которые могут быстро реагировать. Мы должны подготовить нашу армию к такому виду войны."
 ITA_a_bandits_war_re_b_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_MOTORIZED_ATTACK_FACTOR$: §G+10.0%§! \n$MODIFIER_MECHANIZED_ATTACK_FACTOR$: §G+10.0%§! \n$MODIFIER_ARMY_SPEED_FACTOR$: §G+10.00%§! \n$MODIFIERS_ARMY_ARMOR_ATTACK_FACTOR$: §G+10.0%§! \n\n"
 ITA_army_leaders_b:0 "[GetLeaderName]"
 ITA_army_leaders_b_default:0 "Военные лидеры"
 ITA_army_leaders_b_alt:0 "Чистка в руководстве"
 ITA_army_leaders_b_desc:0 "[GetLeaderDesc]"
 ITA_army_leaders_b_desc_default:0 "Наши армии должны всегда возглавлять самые способные офицеры. Важно обеспечить стабильный поток новых и компетентных офицеров, чтобы поддерживать преимущество."
 ITA_army_leaders_b_desc_alt:0 "Хватит дураков, хватит слабости, хватит некомпетентного руководства — пора избавиться от старых и сомнительных личностей, которые стали причиной нашего поражения в Эфиопии."
 ITA_superesercito_b:0 "[GetSuperName]"
 ITA_superesercito_b_default:0 "Суперсержант"
 ITA_superesercito_b_alt:0 "Реформированная армия [ITA.GetAdjective]"
 ITA_superesercito_b_desc:0 "[GetSuperDesc]"
 ITA_superesercito_b_desc_default:0 "Координация крупной армии — задача не из лёгких. Нам необходимо создать структуру для высшего командования, которое будет направлять и поддерживать войска на поле боя."
 ITA_superesercito_b_desc_alt:0 "Здесь, в Риме, горечь поражения всё ещё ощущается, но боль давно ушла — осталась только неугасимая жажда быть лучше, чем когда-либо."
 ITA_superesercito_re_a_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_militia_max_org_factor$: §G+10.0%§! \n$modifier_army_sub_unit_militia_attack_factor$: §G+10.0%§! \n$modifier_army_sub_unit_militia_defence_factor$: §G+10.00%§! \n$modifier_army_sub_unit_militia_speed_factor$: §G+10.00%§! \n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: §G+25.00%§! \n\n"
 ITA_superesercito_re_b_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_COMMAND_POWER_GAIN_MULT$: §G+30.0%§! \n$MODIFIER_MAX_COMMAND_POWER_MULT$: §G+15.0%§! \n$MODIFIER_SPECIAL_FORCES_CAP$: §G+5.00%§! \n$MODIFIER_SPECIAL_FORCES_DEFENCE_FACTOR$: §G+5.0%§! \n$MODIFIER_SPECIAL_FORCES_ATTACK_FACTOR$: §G+5.0%§! \n\n"
 ITA_superesercito_re_c_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_MAX_DIG_IN$: §G+20.0%§! \n$MODIFIERS_ARMY_ATTACK_FACTOR$: §G+5.0%§! \n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: §G-20.00%§! \n\n"
 ITA_superesercito_re_d_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ARMY_SPEED_FACTOR$: §G+15.0%§! \n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-15.0%§! \n$MODIFIER_ARMY_ORG$: §G+5.00%§! \n$MODIFIERS_ARMY_ARMOR_ATTACK_FACTOR$: §G+5.0%§! \n\n"
 ITA_italian_tankettes_b:0 "[GetTanketteName]"
 ITA_italian_tankettes_b_default:0 "Итальянский танкет"
 ITA_italian_tankettes_b_alt:0 "Совсем новый итальянский военный аппарат"
 ITA_italian_tankettes_b_desc:0 "[GetTanketteDesc]"
 ITA_italian_tankettes_b_desc_default:0 "Пока другие страны разрабатывают всё более крупные и тяжёлые танки, стремясь создать супертанк, который сделает все остальные танки устаревшими, мы знаем, что лучший танк — это тот, который действительно находится на поле боя. Танку достаточно быть достаточно быстрым, чтобы вовремя прибыть в нужное место, и ему нужна броня, способная выдержать огонь винтовок. Такой танк будет дешёвым и быстрым в производстве."
 ITA_italian_tankettes_b_desc_alt:0 "Несмотря на то, что изначально мы считали, что танк должен быть мобильным и дешёвым, стремительный технологический прогресс и наша решимость позволили Эфиопии остановить наши машины. Теперь дешевый и быстрый танк уже не имеет значения. Нам нужно только лучшее."
 ITA_divisioni_alpine_b:0 "[GetAlpineName]"
 ITA_divisioni_alpine_b_default:0 "Дивизии Альпийские"
 ITA_divisioni_alpine_b_alt:0 "Цвет нации"
 ITA_divisioni_alpine_b_desc:0 "[GetAlpineDesc]"
 ITA_divisioni_alpine_b_desc_default:0 "Наша память о Великой войне всегда будет связана с ожесточёнными боями в высоких Альпах. Если нам снова придётся защищать страну от иностранного вторжения, это, без сомнения, будет происходить с севера и потребует сражений в негостеприимных горах. Мы должны иметь солдат, способных эффективно сражаться в таком ландшафте."
 ITA_divisioni_alpine_b_desc_alt:0 "Несмотря на наше поражение, некоторые сектора всё ещё демонстрируют частые победы на поле боя. Это были те, кто прошёл обучение под руководством лучших представителей поколения, ушедшего в Великой войне. Нам следует стремиться преобразовать наши элитные силы в эту модель эффективных горных бойцов."
 ITA_self_propelled_guns_b:0 "[GetPropelledName]"
 ITA_self_propelled_guns_b_default:0 "Самоходные орудия"
 ITA_self_propelled_guns_b_alt:0 "Бог на поле боя"
 ITA_self_propelled_guns_b_desc:0 "[GetPropelledDesc]"
 ITA_self_propelled_guns_b_desc_default:0 "Танк, безусловно, произвёл революцию в ведении войны, но во многих аспектах самоходное орудие является самым ценным транспортом на поле боя. Поддержка огнем, которую предоставляют относительно дешевые и простые машины, незаменима при пробитии укреплений или борьбе с вражескими танками."
 ITA_self_propelled_guns_b_desc_alt:0 "Существуют дорогие танки с невероятной бронёй, которые могут легко выдержать обстрелы противотанковых винтовок или даже близкую авиационную поддержку. Однако мы видели лучшее — ничто так не внушает страх, как мобильное противотанковое орудие, способное выпускать самые мощные и точные бронебойные снаряды. Или они будут выпускать дождь взрывных снарядов, с которым враги не смогут справиться."
 ITA_end_fiat_ansaldo_duopoly_b:0 "Обвинение в дуополии Fiat-Ansaldo"
 ITA_end_fiat_ansaldo_duopoly_b_desc:0 "Там, где это имело наибольшее значение, именно связь между Fiat и Ansaldo, а также их дуополия, мешала разработке более эффективных механизмов для нашей военной усилий. Нам нужно расширить наши возможности, укрепить наши позиции, и для достижения этой цели мы должны сначала разрушить эту дуополию и реформировать наш рынок в наиболее желаемую форму."
 ITA_modernize_ansaldo_facilities_b:0 "Новый менеджмент в Ansaldo"
 ITA_modernize_ansaldo_facilities_b_desc:0 "Экономический спад, последовавший за Великой войной, погрузил Ansaldo в финансовые трудности, из-за которых они не могли должным образом модернизировать свои заводы. Лишь их высокий статус спасал их от банкротства. Несмотря на этот слабый момент, или, может быть, именно по этой причине, их вред нашему военному делу был неизмерим."
 LSM_ITA_defeat.1.t: "Быстрая индустриализация"
 LSM_ITA_defeat.1.d: "Лишь несколько месяцев спустя после завершения дуополии Fiat-Ansaldo наша промышленность переживает появление фирм, восставших из пепла нашего поражения в Эфиопии. [ITA.GetNameDef] теперь выглядит совсем иначе, чем в прошлом, и она будет только развиваться с течением времени. Весь мир должен быть готов к чудесному восстановлению."
 LSM_ITA_defeat.1.a: "Новое будущее!"
 LSM_ITA_defeat_1_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$modifier_production_speed_arms_factory_factor$: §G+25.00%§! \n$modifier_production_speed_industrial_complex_factor$: §G+25.00%§! \n\n$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G-25.00%§! \n\n"
 LSM_ITA_defeat.2.t: "Труд приносит плоды"
 LSM_ITA_defeat.2.d: "Управление Ansaldo оправдало себя, так как наша промышленность и армия теперь могут работать в полной синергии. Новые двигатели разрабатываются, новые боевые машины находятся в производстве, и множество будущих проектов уже в работе. С государственной волей и поддержкой трудящихся, мы на пути к тому, чтобы стать Италией, сильной как никогда."
 LSM_ITA_defeat.2.a: "Всё ради государства"
 LSM_ITA_defeat_2_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §G+25.00%§! \n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+25.00%§! \n\n"
 LSM_ITA_defeat.3.t: "Горечь поражения"
 LSM_ITA_defeat.3.d: "Война, в которой мы недавно потерпели поражение, никогда не была войной между цивилизациями — были только мы и они, и в конце исход был более чем очевиден: мы потерпели поражение. Армия взяла на себя ответственность за это поражение, но все знают, что наши проблемы лежат гораздо глубже. Для того чтобы встать вновь сильными и стойкими, Италии нужно взглянуть в лицо собственной реальности."
 LSM_ITA_defeat.3.a: "Ещё одна встреча в высоком собрании..."
 LSM_ITA_defeat.4.t: "Кто виноват?"
 LSM_ITA_defeat.4.d: "Мы осмотрели наши орудия, мы проанализировали наши бои, но есть ещё одно место, куда мы не заглянули — в руководство нации. [ITA.GetLeader] знает, что каждый ищет, на кого свалить вину, будь это правда или нет, ведь они сделали бы то же самое с другими, если бы могли. Однако в такое время только честность может быть решением."
 LSM_ITA_defeat.4.a: "[ITA.GetLeader] берёт на себя ответственность"
 LSM_ITA_defeat.4.b: "Вина Великого совета"
 LSM_ITA_defeat.5.t: "Лучше, чем когда-либо!"
 LSM_ITA_defeat.5.d: "Мы пошли по самому длинному пути, через самую длинную ночь и самые суровые дни. И то, что мы нашли в конце, — это части нас и нашей нации, которые рассыпались на пути. Но только тогда чудо зажглось! Италия восстановилась, Италия стала значительно сильнее, Италия стала гораздо величественнее!"
 LSM_ITA_defeat.5.a: "Больше никакой слабости"
 LSM_ITA_defeat.6.t: "Расширение возможностей офицеров"
 LSM_ITA_defeat.6.d: "С устаревшими и упрямыми глупцами покончено, а свобода мысли в армии теперь восстановлена, и новые, талантливые командиры начинают появляться со всех уголков нашей великой нации. Наша обязанность — вести их вперёд и готовить к растущему напряжению в мире."
 LSM_ITA_defeat.6.a: "Для сильной Италии"
 LSM_ITA_defeat_6_tt:0 "§G10§! новые генералы появятся.\n\n$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ARMY_LEADER_COST_FACTOR$: §G-50.0%§! \n$MODIFIER_XP_GAIN_FACTOR$: §G+50.0%§! \n$MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$: §G-50.0%§! \n\n"
 LSM_ITA_defeat.7.t: "Горные элиты"
 LSM_ITA_defeat.7.d: "Горные дивизии — одни из лучших в истории нашей нации, но всегда есть пространство для улучшений. Хотя многие утверждают, что эра танков уже наступила, только горные стрелки могут действительно выиграть нам войну, если нам когда-либо придётся столкнуться с угрозой вторжения на родную землю. Ведь везде, где эти люди сражались в Эфиопии, наши враги лишь терпели поражения."
 LSM_ITA_defeat.7.a: "Возвышение гор"
 LSM_ITA_defeat_7_tt:0 "Тщательная подготовка позволит нашим офицерам лучше адаптироваться к суровому рельефу полуострова и Альп.\n\n$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_SPECIAL_FORCES_CAP$: §G+10.0%§! \n$MODIFIER_SPECIAL_FORCES_ATTACK_FACTOR$: §G+10.0%§! \n$MODIFIER_SPECIAL_FORCES_DEFENCE_FACTOR$: §G+10.0%§! \n$modifier_army_sub_unit_mountaineers_max_org_factor$: §G+10.0%§! \n\n"
 LSM_ITA_defeat.8.t: "Пересмотрены производители артиллерии"
 LSM_ITA_defeat.8.d: "Наша проверка основных производителей артиллерийских орудий показала растущую потребность в прямом контроле над нашей военной промышленностью. Теперь, когда мы укрепили производственные мощности и централизовали разработку, необходимо ясно дать понять, что наша военная промышленность требует конкретной цели и определить её для наших производителей."
 LSM_ITA_defeat.8.a: "Лучшее вооружение"
 LSM_ITA_defeat.8.b: "Больше производства"
 LSM_ITA_defeat.9.t: "Реорганизация производителей бронетехники"
 LSM_ITA_defeat.9.d: "Наши разработчики и производители тяжёлой бронетехники, Fiat и Ansaldo, сегодня были реорганизованы в лучшую форму, нежели при управлении по собственному усмотрению. Наши производственные линии значительно улучшились, и мы ожидаем достичь нового рубежа в производственных объемах в течение следующих нескольких месяцев, хотя это может повлечь за собой снижение надёжности техники."
 LSM_ITA_defeat.9.a: "Нагоняем мир"
 LSM_ITA_defeat.10.t: "Италия просит обмен пленными на свои колонии"
 LSM_ITA_defeat.10.d: "Сегодня утром [ITA.GetLeader] запросил прямое общение с [ETH.GetLeader], надеясь договориться о обмене пленными на оставшиеся владения Италии в Восточной Африке. Конечно, это будет значительное развитие событий в нашем контроле над регионом, но согласятся ли эфиопы на такое предложение, когда те пленные войны заслуживают лишь самых суровых наказаний?"
 LSM_ITA_defeat.10.a: "Принять предложение"
 LSM_ITA_defeat.10.b: "Трофеи останутся"
 LSM_ITA_defeat.11.t: "[ETH.GetNameDef] согласился"
 LSM_ITA_defeat.11.d: "Официальное соглашение, подписанное сегодня утром в 06:00, позволило Италии продолжить использовать порты для эвакуации личного состава, большинство из которых были бывшими пленными, а другие — активными военнослужащими. Теперь, по взаимному соглашению, Италия обязана вывести свои войска, а эфиопские силы вступят в регион для обеспечения новых территорий. Тем не менее, это ознаменовало новый этап в истории Италии..."
 LSM_ITA_defeat.11.a: "Добро пожаловать домой..."
 ITA_proclaim_the_italian_empire_b: "Провозглашение Новой Итальянской Империи"
 ITA_proclaim_the_italian_empire_b_desc: "Пессимистический исход Второй Итало-Эфиопской войны завершён, с его горьким послевкусием, давно ушедшим, а наши бывшие враги процветают после нашего поражения. Населению Италии необходимо возрождение духа и решимости, поддерживаемое крепкими связями между [ITA.GetNameDef] и другой великой нацией."
 ITA_italo_japan_pact: "Итало-Японский пакт"
 ITA_italo_japan_pact_desc: "Японцы не так уж сильно отличаются от нас: они хотят оторвать кусок от тех мерзких англичан и французов, и мы тоже. Наши народы должны сблизиться, чтобы перегнать тех, кто предал нас в последней войне."
 ITA_overture_to_asia: "Ода Азии"
 ITA_overture_to_asia_desc: "Исчерпавшаяся Африка оставляет мало пространства для нас после потери позиции в Восточной Африке, но всегда есть путь вперёд в других регионах, и мы должны превратить свои усилия в реальность, пока кто-то другой не сделает это первым."
 ITA_italo_german_pact: "Итало-Германский пакт"
 ITA_italo_german_pact_desc: "Немцы не так уж сильно отличаются от нас: горькие, голодные и полные презрения к тем мерзким ублюдкам в Англии и Франции. Наши народы должны сблизиться, чтобы перегнать тех, кто обманул нас в последней войне."
 ITA_german_cooperation_b: "Национализм в Европе"
 ITA_german_cooperation_b_desc: "Неважно, стремится ли Италия к расширению, она всегда должна помнить свои корни в Европе, где её враги остаются слабыми и неспособными, наслаждаясь триумфом победы уже много лет. Италия будет прокладывать свой путь вперёд."
 ITA_proclaim_the_italian_empire_a: "Великая Декларация"
 ITA_proclaim_the_italian_empire_a_desc: "Нашей Империи не нужно признание тех, кто нас ненавидит! Наша Империя восстанет под орлиными крыльями, как когда-то процветали наши предки. Итальянская Империя неизбежна."