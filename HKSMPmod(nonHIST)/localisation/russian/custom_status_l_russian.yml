 country_status_events.1.t: "[Root.GetName] повышается до сверхмажора"
 country_status_events.1.d: "Некогда бывшая региональная держава бурным темпом наращивает свою экономику, и уже диктует мировые условия под себя. Сохранится ли мир в таких условиях, и что скажут на это другие сверхдержавы?"
 country_status_events.1.d_major: "Государство, прочно вошедшее в историю хочет распостранить влияние на весь мир. Баланс сил в мире нарушен, и теперь передовые державы обязаны учитывать интересы и других народов."
 country_status_events.1.a: "Мир ещё никогда не был так разделён"

 country_status_events.2.t: "[Root.GetName] понижается до мажора"
 country_status_events.2.d: "Мировой Гигант стагнирует и вот-вот разваливается. Его противники празднуют экономическую победу, а жители не знают: может ли быть ещё хуже?"
 country_status_events.2.d_major: "Закат исторического государство повлияло на весь мир. Расстановка сил кратно изменилась, отдельные части бывшей сверхдержавы уже находятся под влиянием соседей."
 country_status_events.2.a: "Очередной мастадонт в тени"

 country_status_events.3.t: "[Root.GetName] повышается до мажора"
 country_status_events.3.d: "Небольшое государство за считанные сроки смогло в несколько раз увеличить свои территорию, население, экономику и армию. Теперь оно имеет свой голос на мировой арене и держит в страхе своих соседей."
 country_status_events.3.d_major: "После сокрушительного краха история вновь повторяется, и новый рейх начинает представлять всю большую угрозу. Сможет ли он вернуть свои позиции?"
 country_status_events.3.a: "Новый кандидат на величие?"

 country_status_events.4.t: "[Root.GetName] понижается до минора"
 country_status_events.4.d: "Малая страна, получившая минуту славы, вновь становится мелкой и незначительной преградой. Поможет ли это ей в дипломатии с другими странами?"
 country_status_events.4.d_major: "Любое государство не вечно, и народ страны всегда это понимал. Бывшая великая нация, о которой написано в каждом учебнике мира, останется лишь в небольших заголовках газет."
 country_status_events.4.a: "Ещё один обездоленный"
 
