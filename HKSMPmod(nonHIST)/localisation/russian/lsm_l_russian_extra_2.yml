l_russian:
 SOV_rebuild_the_home_of_santa: "Дом Санта-Клауса"
 SOV_rebuild_the_home_of_santa_desc: "Рованиеми, родина Санта-Клауса, наконец стал частью [SOV.GetNameDef]. Теперь, будучи его новым хранителем, мы обязаны поддерживать здесь наилучшие условия."
 SOV_tourism: "Туризм в Рованиеми"
 SOV_tourism_tt: "§R Этот национальный дух будет удалён, если пятилетний план будет нарушен§!"
 AI_antitank_licensing_0: "Лицензирование ПТО"
 AI_antitank_licensing_1: "Лицензирование ПТО"
 AI_antitank_licensing_2: "Лицензирование ПТО"
 the_second_weltkrieg_decision_cat: "Дежавю"
 graveyard_of_empire: "Кладбище империй"
 develop_moravia_oil_fields: "Выкачивание нефтяных запасов"
 develop_tasmanian_tungsten: "Разработка месторождений вольфрама в Тасмании"
 develop_home_island_tungsten: "Добыча ресурсов в Канадзаве"
 develop_congo_tungsten: "Разработка месторождений вольфрама в Конго"
 develop_state_57_steel: "Расширение сталелитейного завода в Дуйсбурге"
 develop_state_55_steel: "Увеличение добычи железной руды в Хайдельберге"
 develop_state_54_steel: "Открытие нового сталелитейного завода во Франконии"
 develop_state_50_steel: "Финансирование металлургических предприятий в Баден-Вюртемберге"
 SOV_the_collectivization_process_b:0 "[GetCollectivizationName]"
 SOV_the_collectivization_process_b_default:0 "Процесс коллективизации"
 SOV_the_collectivization_process_b_alt:0 "Коллективизация в условиях войны"
 SOV_the_collectivization_process_b_desc:0 "[GetCollectivizationDesc]"
 SOV_the_collectivization_process_b_desc_default:0 "Хотя впереди ещё много работы, а в некоторых регионах процесс был проведён крайне неудачно, коллективизация сельского хозяйства в Советском Союзе близится к завершению. Вскоре она приведёт к росту сельскохозяйственного производства."
 SOV_the_collectivization_process_b_desc_alt:0 "Коллективизация была прервана внезапным началом войны. Конечно, впереди ещё много работы, и в ходе реформ были допущены ошибки, но теперь наша политика перемен и коллективизации должна продолжаться с единственной целью — победить в войне!"
 SOV_the_collectivization_process_tooltip_1: "$SOV_modify_the_politburo_ns_intro$ \nПотребительские фабрики: §Y-5.0%§! \nМаксимальное число заводов в регионе: §G+5%§! \nСкорость строительства: §G+5.00%§! \n\n"
 SOV_the_collectivization_process_c_ns_tt: "$SOV_modify_the_politburo_ns_intro$ \nПотребительские фабрики: §Y-15.0%§! \nМаксимальное число заводов в регионе: §G+15%§! \nСкорость строительства: §G+15.00%§! \n\n"
 SOV_the_collectivization_process_tooltip_2: "\n§RИз-за принудительной коллективизации во время войны население СССР уменьшится. Масштаб эффекта зависит от текущей стабильности§! \n\n§C[SOV.GetAdjective] экономика в течение двух лет будет восстанавливаться после начала войны, постепенно укрепляя производство и централизацию внутри партии§! \n\n"
 SOV_the_collectivization_process_ns_a_tt: "§RЕсли пятилетний план будет нарушен, немедленный эффект ослабнет, процесс коллективизации перестанет приносить новые заводы, а население окажется крайне истощённым.§!"
 SOV_organization_centralization_discipline_b:0 "[GetCentralizationName]"
 SOV_organization_centralization_discipline_b_default:0 "Централизация и дисциплина"
 SOV_organization_centralization_discipline_b_alt:0 "Централизованный комитет по военным вопросам"
 SOV_organization_centralization_discipline_b_desc:0 "[GetCentralizationDesc]"
 SOV_organization_centralization_discipline_b_desc_default:0 "В это время неопределённости народ смотрит на Политбюро в поисках стабильности и руководства. Мы должны обеспечить, чтобы этот орган не только поддерживал решения товарища Сталина, но и был в них един."
 SOV_organization_centralization_discipline_b_desc_alt:0 "Время нестабильности требует твёрдой и решительной руки, которая поведёт Советский Союз к порядку и процветанию. Впереди нас ждёт тяжёлая и беспощадная война, но Политбюро будет следовать единственному принципу — тишина, порядок и методичность."
 SOV_organization_centralization_discipline_b_ns_tt: "$SOV_modify_the_politburo_ns_intro$ \nМаксимальный запас командной мощности: §G+50§! \nСкорость мобилизации: §G+5.00%§! \n\n"
 SOV_organization_centralization_discipline_c_ns_tt: "\nДобавляет §Y$SOV_planned_economy_dynamic_modifier$§!, который даёт: \nПроизводительность фабрик: §G+10.00%§!, Штраф за нехватку ресурсов: §G-10.00%§!, Скорость ремонта фабрик: §G+10.00%§! \n\n"
 SOV_everything_for_the_state_idea: "Централизация и дисциплина"
 SOV_war_economy_b:0 "[GetWarEconomyName]"
 SOV_war_economy_b_default:0 "Военная экономика"
 SOV_war_economy_b_alt:0 "Коллективизированная военная экономика"
 SOV_war_economy_b_desc:0 "[GetWarEconomyDesc]"
 SOV_war_economy_b_desc_default:0 "Очевидно, что капиталистические и реакционные нации на наших границах планируют ударить в момент нашей слабости. Чем быстрее мы перейдем к военной экономике, тем лучше."
 SOV_war_economy_b_desc_alt:0 "Ясно, что выживание нашей Родины угрожает ужасным злом, исходящим за пределами наших границ, несущим невообразимый ужас для нашего народа. Наша экономика, недавно принявшая процесс коллективизации, теперь должна начать великое преобразование в экономику, более подходящую для войны."
 SOV_war_economy_b_ns_tt: "$SOV_modify_the_politburo_ns_intro$ \nУвеличение максимальной командной мощи: §G+50§! \nСкорость мобилизации: §G+5.00%§! \n\n"
 war_economy_b_ns_tt_extra: "§CБлагодаря нашему текущему экономическому моделированию, наша промышленность может быстро адаптироваться к коллективизированной военной экономике, что позволит завершить прерванный Пятилетний план.§! \n\n"
 SOV_transitional_economy: "Переходная экономика"
 SOV_industrialization_boost: "Введение политики коллективизации и индустриализации"
 SOV_industrialization_boost_2: "Принятие политики коллективизации и индустриализации"
 SOV_industrialization_boost_2_desc: "§RВо время процесса население может снизиться, пока промышленная база претерпевает значительные изменения.§!"
 SOV_industrialization_boost_3: "Результаты политики коллективизации и индустриализации"
 SOV_transitional_economy_desc: "В настоящее время мы проходим значительные изменения в нашей экономической модели, чтобы лучше соответствовать текущему конфликту.§CПосле завершения перехода наша экономическая централизация значительно улучшится.§!"
 SOV_civilian_labor_in_defense_mod_a: "Гражданский труд в обороне"
 SOV_factory_worker_militias_raised_a: "Фабричные рабочие милиции"
 SOV_defend_moscow_a: "Оборона Москвы"
 SOV_santaism: "Защитник детей"
 SOV_north_poles_engineering: "Инженерия Северного Полюса"
 SOV_north_poles_engineering_desc: "Трудности замерзшего севера привели к разработке инженерных решений, выходящих за рамки общедоступных знаний наших ученых. Использование этих технологий позволит нам производить современные транспортные средства с увеличенным радиусом действия и высокой надежностью."
 SOV_santa_propaganda: "Криссмарксистская пропаганда"
 santa_propaganda: "Распространение криссмарксистской пропаганды"
 SOV_neutrality_idea: "Рождественизм в одной стране"
 SOV_aggressive_idea: "Вечная криссмарксистская революция"
 SOV_universal_welfare: "Всеобщее благосостояние"
 SOV_elves_in_the_industry_1: "Введение магических эльфов в промышленность"
 SOV_elves_in_the_industry_2: "Интеграция магических эльфов в рабочую силу"
 SOV_elves_in_the_industry_3: "Реорганизация социальных классов"
 SOV_elves_in_the_industry_4: "Омоложенная [SOV.GetAdjective] экономика"
 SOV_no_more_hunger: "Больше не будет лишений"
 SOV_population_growth: "Максимальный Рождественизм в политике по детям"
 SOV_winter_sleigh: "Магия саней"
 SOV_finish_finland: "Магия зимы"
 SOV_reward_the_children: "Награда детям"
 SOV_reward_the_administration: "Награда администрации"
 SOV_reward_the_working_class: "Награда рабочему классу"
 SOV_reward_the_military: "Награда армии"
 SOV_santa_baltic_annexation_tt:0 "§8Советский Союз получает претензии на все балтийские провинции, контролируемые собой или балтийскими странами"
 SOV_santa_5_tt:0 "$SOV_modify_fyp_ns_intro$ \nЭффективность получения ресурсов: §G+50%§!"
 SOV_santa_6_tt1:0 "§CИнтеграция эльфийского населения в наше общество может столкнуться с трудностями на начальном этапе, но это позволит освободить различные секторы нашего общества от их нынешних проблем и может стать катализатором скрытого роста нашей экономики.§! \n\n"
 SOV_santa_6_tt2:0 "§RОднако эльфийское население растет крайне медленно по сравнению с человеческим, и любое быстрое расширение [SOV.GetNameDef] может поставить их в трудное положение и привести к потенциальному исключению.§! \n\n"
 SOV_santa_8_tt1:0 "§CКолодец магии, исходящий из Северного Полюса, откроет [SOV.GetNameDef] тайны Земли и её богатые ресурсы.§! \n\n"
 SOV_santa_8_tt2:0 "Получить §Y300§! единиц стали. \nПолучить §Y115§! единиц нефти. \nПолучить §Y90§! единиц вольфрама. \nПолучить §Y69§! единиц алюминия. \nПолучить §Y28§! единиц хрома. \nПолучить §Y71§! единиц каучука. \n\n"
 SOV_santa_11_army_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nОрганизация дивизий: §G+10.0%§! \nАтака кавалерии: §G+10.0%§! \nСнижение штрафа за местность: §G+10.0%§! \n\n"
 SOV_santa_11_air_tt:0 "$SOV_modify_airforce_ns_intro$ \nШанс авиационных происшествий: §G-25.0%§! \nШтраф за ночные операции: §G-25.00%§! \nШтраф за плохую погоду: §G-25.00%§! \n\n"
 SOV_santa_12_tt1:0 "$SOV_modify_fyp_ns_intro$ \nФабрики потребительских товаров: §Y-10.0%§! \nБазовая эффективность производства: §G+25.00%§! \n£prod_eff Рост эффективности производства: §G+25.00%§! \n\n"
 SOV_santa_12_tt2:0 "Каждое государство в [SOV.GetNameDef], имеющее менее 4 уровней инфраструктуры, получит 1 дополнительный уровень инфраструктуры."
 SOV_santa_14_tt:0 "Новые завоеванные государства теперь начинают с §C20% соблюдения§!"
 SOV_universal_welfare:0 "Всеобщее благосостояние"
 SOV_universal_welfare_desc:0 "В результате нашей приоритетной политики благосостояния, наша страна считается безопасным убежищем для многих, независимо от обстоятельств войны. \n\nНовые завоеванные государства теперь начинают с §C25% соблюдения§!"
 SOV_universal_welfare_tooltip:2 "Обратная связь с полевыми госпиталями: §G+30%§!\nФактор потерь от экспорта: §G-40%§!"
 SOV_santa_16_air_tt:0 "$SOV_modify_airforce_ns_intro$ \nНаземная поддержка: §G+25.0%§! \nВидимость стратегических бомбардировок: §G-50.00%§! \nШтраф за ночные стратегические бомбардировки: §G-50.00%§! \n\n"
 SOV_santa_17_tt:0 "§8Иосиф Сталин вернется в Советский Союз как рождественский подарок, став гораздо сильнее и величественнее, чем прежде, с новым магическим телом царя.§!"
 SOV_santa_18_trotsky_tt:0 "§8Лев Троцкий вернется в Советский Союз как рождественский подарок; к сожалению, он не очень хорошо адаптировался к своему новому телу.§! \n\n"
 SOV_santa_18_main_tt:0 "§8Некоторые персонажи, ранее очищенные или заключенные Иосифом Сталиным, также вернутся в качестве советников.§!"
 SOV_santa_19_tt:0 "Ежегодно, через Рождественский Новый План Санты, [SOV.GetNameDef] сможет интегрировать новозавоеванные территории с более чем §C50% соблюдения§!, а население магических эльфов будет расти немного быстрее."
 SOV_santa_20_tt:0 "Немедленно получить территориальные претензии на §Cвсе государства, входящие в западную культурную сферу.§! \n\nЕжегодно, через Рождественский Новый План Санты, [SOV.GetNameDef] сможет интегрировать захваченные территории под свой контроль с более чем §C50% соблюдения§!"
 SOV_santa_1:0 "Под звездой рождественской елки"
 SOV_santa_1_desc:0 "Советский Союз больше не тот, что был раньше, появился новый лидер, с бородой столь величественной, сердцем столь великодушным, но с цветом красным, гораздо более ярким. Время Рождества."
 SOV_santa_2:0 "Дом Санта-Клауса?"
 SOV_santa_2_desc:0 "Есть место в Финляндии, которое считается домом Санта-Клауса, его началом, местом, где он оставался на протяжении невообразимых веков."
 SOV_santa_3:0 "Переосмысление границ"
 SOV_santa_3_desc:0 "Чтобы экспортировать счастье по всему миру, нам сначала нужно улучшить потоки товаров и доступность крупных транспортных узлов."
 SOV_santa_4:0 "Магия саней"
 SOV_santa_4_desc: "Есть один секрет Санта-Клауса: его сани. Именно с этих саней доставлялись подарки, именно с их помощью была обеспечена глобальная транспортировка товаров и принесено счастье. Применение этой чудодейственной инженерной разработки на национальном уровне является необходимым условием для успешной модернизации нашего общества."
 SOV_santa_5:0 "Эльфы в шахтах"
 SOV_santa_5_desc:0 "Раса Эльфов, которая помогала Санта-Клаусу на протяжении веков, кажется, стремится сохранить свои позиции в роли помощников Деда Мороза, но мало что известно о его отношениях с этой эльфийской расой. Тем не менее, если они пожелают работать, им следует предоставить необходимое горное оборудование."
 SOV_santa_6:0 "Эльфы в промышленности"
 SOV_santa_6_desc:0 "Раса Эльфов, которая помогала Санта-Клаусу на протяжении веков, кажется, стремится сохранить свои позиции в роли помощников Деда Мороза, но мало что известно о его отношениях с этой эльфийской расой. Тем не менее, если они пожелают работать, им следует предоставить необходимое промышленное обучение."
 SOV_santa_7:0 "Инженерия Северного полюса"
 SOV_santa_7_desc:0 "Жёсткий север, который мы пренебрегали на протяжении веков, оказался источником полезных технологий, которые мы ранее считали непригодными для наших условий."
 SOV_santa_8:0 "Дальнейшее освоение Земли"
 SOV_santa_8_desc:0 "Для поддержания производства подарков и презентов не только для всех [SOV.GetAdjective] детей, но и для детей по всему миру, Санта-Клаус нуждается в быстром расширении проектов по добыче и горной промышленности."
 SOV_santa_9:0 "Улучшение уровня жизни"
 SOV_santa_9_desc:0 "Корень глобального счастья заключается в устойчивом источнике пищи. Наша страна обширна, и хотя суровая зима может мешать сельскому хозяйству, с помощью Санта-Клауса урожай и скот будут процветать на обширных степях."
 SOV_santa_10:0 "Для детей всего мира"
 SOV_santa_10_desc: "Каждая цивилизация и каждое общество начинается с детей, ведь именно они держат ключ к будущему любых поколений. Программы по обеспечению жилья и развитию должны быть направлены на удовлетворение фундаментальных потребностей для того, чтобы помочь детям расти в мире счастья."
 SOV_santa_11:0 "Государственная программа доставки подарков"
 SOV_santa_11_desc:0 "Существуют государства, которые на протяжении многих лет сеют смерть и разрушение без каких-либо последствий. Нашей стране необходимо улучшить стратегию милитаризации, чтобы лучше противостоять угрозам за пределами наших границ и защищать наше общество."
 SOV_santa_12:0 "Завершение экономической трансформации"
 SOV_santa_12_desc:0 "Невозможно существование счастливой нации без сильной и устойчивой экономики, и этот процесс потребует от нашей промышленности большей гибкости, чтобы отвечать на постоянно меняющиеся потребности рынка, не только для военных нужд и потребления, но и для общества в целом."
 SOV_santa_13:0 "Переосмысление цвета красного"
 SOV_santa_13_desc:0 "В течение многих лет красный цвет ассоциировался с терроризмом, внезависимости от того, что единственная потребность пролетариата — это больше свободы в своей жизни и, следовательно, равенства как человеков. Однако эта эпоха ушла в прошлое — красный цвет теперь стал цветом Рождества! Это теперь символ равенства и защиты детей и нуждающихся! Это теперь основное олицетворение интернационализма!"
 SOV_santa_14:0 "Универсальное социальное государство"
 SOV_santa_14_desc:0 "Наш акцент на развитие общества позволил создать величайшую цивилизацию, какую только знала история, и тем самым реализовать мечту Санта-Клауса — однако есть так много других вещей, которые можно сделать для дальнейшего укрепления уже существующей системы. [SOV.GetNameDef] станет раем на Земле!"
 SOV_santa_15:0 "Образование детей"
 SOV_santa_15_desc:0 "Дети всегда являются будущим любого поколения, независимо от трудностей и борьбы. Те страны, которые не признали эту важнейшую предпосылку для функционирования общества, будут поглощены варварским пламенем войны и бесконечным морем испытаний."
 SOV_santa_16:0 "Международные процедуры доставки подарков"
 SOV_santa_16_desc:0 "Необходимо, чтобы наша армия была реорганизована таким образом, чтобы подарки доставлялись не только своевременно, но и с максимальными полезными нагрузками. Рождество должно приносить улыбки всем детям мира!"
 SOV_santa_17:0 "Второй Дед Мороз"
 SOV_santa_17_desc:0 "До Санта-Клауса уже был Иосиф Сталин. В некотором смысле Сталин всегда был предшественником, и мы можем только благодарить Сталина за то, что в своём уходе он назначил Санта-Клауса новым лидером [SOV.GetAdjective] народа. Конечно, как лучший друг Сталина, Санта-Клаус считает справедливым вернуть своего друга из объятий смерти!"
 SOV_santa_18:0 "Реформатор социалистической концепции"
 SOV_santa_18_desc:0 "До Санта-Клауса был Иосиф Сталин. В некотором смысле Сталин всегда был предшественником, и Санта-Клаус полагал, что он сможет ответить на его вопросы. Однако, не нарушая мирного и постоянного покоя своего друга, Санта-Клаус обращается к другим коммунистическим лидерам, которые уже не с нами, полагая, что справедливо будет преобразовать их в христианских марксистских министров."
 SOV_santa_19:0 "Рождественизм в одной стране"
 SOV_santa_19_desc:0 "Почему Санта-Клаусу нужно искать дальше, если за пределами наших границ лежат лишь руины варварского и дикого рода? Наша огромная страна — воплощение счастья, принесённого Дедом Морозом, и укрепление этого союза является основным принципом нашей деятельности."
 SOV_santa_20:0 "Перманентная рождественская революция"
 SOV_santa_20_desc: "Печальное и жалкое состояние западной культурной сферы заставило Санту плакать. Мы не можем позволить, чтобы это продолжалось. Рождественизм должен возглавить инициативу по усмирению мировых демонов, чтобы восстановить мир и баланс."
 SOV_santa_21:0 "Санта в космосе"
 SOV_santa_21_desc:0 "Развитие интеллектуальной базы ещё больше укрепило научное стремление [SOV.GetNameDef], и вскоре откроется эра космических исследований и космической доставки подарков."
 SOV_santa_can_into_space: "Санта в космосе"
 LSM_santa.1.t: "[?global.year|0] План на Новый год"
 LSM_santa.1.d: "Пришло время Санта-Клаусу выбрать тему для плана на [?global.year|0] Новый год, чтобы отпраздновать усилия народа. Конечно, будет неправдой сказать, что какая-либо группа людей уступает другой, но Санта-Клаус может поддерживать только одну группу за раз.\n\nС Новым годом!"
 LSM_santa.1.a: "Наградить детей"
 LSM_santa.1.b: "Похвалить администрацию"
 LSM_santa.1.c: "Признать рабочий класс"
 LSM_santa.1.e: "Укрепить армию"
 LSM_santa.2.t: "Дом Санта-Клауса?"
 LSM_santa.2.d: "Санта-Клаус, новоизбранный лидер Советского Союза, любезно предложил мирное воссоединение нашей страны с Советским Союзом в качестве Советской Республики. Тем не менее, у нас нет обязательства требовать такого исхода, и Санта-Клаус гарантировал, что полностью уважает любой выбор [FIN.GetAdject] правительства."
 LSM_santa.2.a: "Принять предложение"
 LSM_santa.2.b: "Вежливо отклонить"
 LSM_santa.3.t: "Санта-Клаус требует подчинения"
 LSM_santa.3.d: "Санта-Клаус, новоизбранный лидер Советского Союза, потребовал полного воссоединения нашей страны с Советским Союзом в качестве Советской Республики. Хотя этот шаг нарушает международный порядок, сам Санта-Клаус, похоже, не держит личной обиды против нашей страны. Тем не менее, хотя возможно избежать полномасштабной войны между двумя странами, необходимо дать ответ в должный срок."
 LSM_santa.3.a: "Принять предложение"
 LSM_santa.3.b: "Вежливо отклонить"
 LSM_santa.4.t: "[FROM.GetNameDef] отклоняет наше требование"
 LSM_santa.4.d: "Правительство [FROM.GetAdjective] быстро отреагировало на наше требование жестким сопротивлением. К сожалению, стратегическое значение их страны не позволяет Советскому Союзу упустить эту возможность для дальнейшего укрепления нашей системы доставки подарков. Более того, как ранее выразил Санта-Клаус, было бы гораздо лучше, если бы страны по всему миру осознали необходимость свободы, мира и сотрудничества. Советский Союз обладает этими качествами в избытке, и вполне естественно, что мы будем экспортировать их в более бедные страны."
 LSM_santa.4.a: "Единственный путь к миру — война"
 LSM_santa.4.b: "Уважать их решение"
 LSM_ENG_churchill.800.t: "Австралия предлагает Федерацию Австралазии"
 LSM_ENG_churchill.800.d: "Вскоре после предложения правительства [AST.GetAdjective] о безопасности в Западно-Тихоокеанском регионе, мы получили ещё одно предложение о объединении всех Тихоокеанских островов под единым правительством, передавая ответственность с Родины на [AST.GetNameDef]. Хотя само предложение давно было предметом интереса для [ENG.GetNameDef], оно никогда ранее не было предложено или запрашивано какой-либо стороной в парламенте [ENG.GetAdjective] или в Верховном Суде."
 LSM_ENG_churchill.801.d: "Посол от парламента [ENG.GetAdjective] и правительства [AST.GetAdjective] прибыл сегодня, чтобы обсудить новое предложение по защите Тихого океана с правительством [NZL.GetAdjective], надеясь достичь соглашения между всеми сторонами о продолжении процесса объединения континента и создании Федерации Австралазии. Вместе с [AST.GetLeader] представлен подробный план интеграции, согласно которому имперские подданные, будь то рожденные в [ENG.GetAdjective] или местного происхождения, с этого момента станут 'австралазийцами'."
 LSM_ENG_churchill.800.a: "Подтвердить с правительством [NZL.GetAdjective]"
 LSM_ENG_churchill.800.b: "Кем они себя возомнили?"
 LSM_ENG_churchill.800.c: "Нам и так хорошо"
 LSM_ENG_churchill.800.e: "Пусть решат люди"
 AST_the_push_for_australasia: "Австралазийская идентичность"
 AST_the_push_for_australasia_desc: "Тихоокеанский регион невозможно защитить с удаленной Родины Британских островов. Австралия, крупнейшее государство в регионе, должна стать настоящим маяком для развития и безопасности этого региона."
 LSM_ENG_churchill.802.a: "Победа для Тихого океана"
 LSM_ENG_churchill.802.t: "[NZL.GetNameDef] соглашается с предложением Австралазии"
 LSM_ENG_churchill.802.d: "После нескольких раундов переговоров заинтересованные стороны разработали окончательные конституции для формализации интеграции Федерации Австралазии, что стало новым этапом для всего региона. Будет ли это на благо или нет, факт остается фактом: будущее Тихоокеанского содружества теперь лежит на плечах [AST.GetNameDef]."
 LSM_ENG_churchill.803.t: "Предложение о Федерации Австралазии не состоялось"
 LSM_ENG_churchill.803.d: "После нескольких раундов переговоров заинтересованные стороны пришли к выводу, что создание Федерации Австралазии не состоится, что ознаменует окончание волны объединения Тихоокеанских имперских подданных."
 LSM_ENG_churchill.803.a: "Что есть, то есть"
 LSM_ENG_churchill.803.b: "Наше доверие было ошибочным"
 AST_demand_islands: "Предложение об Австралазийской интеграции"
 AST_demand_islands_desc: "Наши союзники в настоящее время контролируют австралазийские территории. Мы должны официально запросить их владения."
 lsm_news.1113.t: "Оформление Федерации Австралазии"
 lsm_news.1113.d: "Под руководством [AST.GetLeader] был разработан план для нового пути к объединению континентальной Океании, которая теперь известна как континент Австралазии, и который с утра был принят парламентом [ENG.GetAdjective] и правительством [NZL.GetAdjective], тем самым формализуя стремящийся символ единства региона.\n\nБудет ли это на благо или нет, факт остается фактом: будущее Тихоокеанского содружества теперь лежит на плечах [AST.GetNameDef]."
 lsm_news.1113.a: "За свободу и единство"
 lsm_news.1113.b: "Слабость умирающей империи"
 LSM_ENG_churchill.804.t: "[From.GetNameDefCap] Запрашивает контроль над австралазийскими территориями [Root.GetAdjective]"
 LSM_ENG_churchill.804.d: "[From.GetNameDefCap] выдвинул дипломатический запрос к [Root.GetNameDef] с просьбой взять под контроль их австралазийские владения. Ссылаясь на новые стратегии их правительства в Тихом океане, министры из [From.GetNameDef] утверждают, что у них есть понимание и глубокие личные отношения с народами Австралазии, что даст им чувство принадлежности и побудит их бороться за дело [From.GetFactionName]."
 LSM_ENG_churchill.804.a: "Разумное предложение"
 LSM_ENG_churchill.804.b: "Эти острова слишком ценны"
 LSM_ENG_churchill.805.t:0 "[From.GetNameDefCap] Принимает!"
 LSM_ENG_churchill.805.d:0 "Наше разумное предложение о контроле над австралазийскими территориями, занятыми [From.GetNameDefCap], было принято, и теперь мы контролируем несколько новых островных территорий."
 LSM_ENG_churchill.805.a:0 "Отлично."
 LSM_ENG_churchill.806.t:0 "[From.GetNameDefCap] отклоняет"
 LSM_ENG_churchill.806.d:0 "Делегация [Root.GetAdjective] в [From.GetNameDefCap] вернулась с разочаровывающей новостью: [Root.GetNameDefCap] не получит австралазийские территории [From.GetNameDefCap]."
 LSM_ENG_churchill.806.a:0 "Проклятие!"