 LSM_new_world_diplomacy.35.t: "Лига Наций"
 LSM_new_world_diplomacy.35.d: "Германия, угроза, породившая великую войну, которая погрузила мир в раздор и разрушила Бельгию в акте террора, объявила войну одному из членов Лиги Наций. В ответ Лига Наций рассматривает возможность вмешательства, которое станет своего рода возмездием, направленным на уничтожение этой угрозы ради блага всего мира."
 LSM_new_world_diplomacy.35.a: "Лига остаётся в силе!"
 LSM_new_world_diplomacy.35.b: "Лига лишена влияния..."
 JAP_imperial_territory_2: "Территория под Имперским контролем"
 LSM_GER_SOV.506.t: "Коммунистическая угроза"
 LSM_GER_SOV.506.d: "Рост влияния коммунизма после действий [SOV.GetNameDef] вызывает серьезную обеспокоенность среди японского народа и руководства. Теперь многие выступают за создание формального союза с [GER.GetNameDef] и [CHI.GetNameDef], чтобы эффективнее противостоять данной угрозе, отодвинув на второй план вопросы противодействия западному империализму."
 LSM_GER_SOV.506.a: "Направить официальное послание [GER.GetLeader]..."
 LSM_GER_SOV.506.b: "...но оформить его как поздравительную открытку ко дню рождения"
 LSM_GER_SOV.507.t: "Коммунистическая угроза"
 LSM_GER_SOV.507.d: "Рост влияния коммунизма после действий [SOV.GetNameDef] встревожил японское население и чиновников. Теперь многие выступают за создание формального союза с [GER.GetNameDef]. Для этого [JAP.GetAdjective] правительство предложило нам подписать договор о процветании с [CHI.GetAdjective] и [JAP.GetAdjective], направленный на создание военного союза с [GER.GetNameDef]."
 LSM_GER_SOV.507.a: "Направить официальное послание [JAP.GetLeader]..."
 LSM_GER_SOV.507.b: "Японский империализм должен быть уничтожен! Ваньсуй!"
 LSM_GER_SOV_506_a_tt: "Если Китай и Япония согласятся на мир: \n\n1. Япония получает контроль над Северным Китаем.\n\n2. Китай потеряет свои права на территории, находящиеся в японской сфере уже бывших китайских территорий."
 LSM_GER_SOV_506_b_tt: "Пока никаких изменений не предвидится, однако Китай может в будущем присоединиться к Германии."
