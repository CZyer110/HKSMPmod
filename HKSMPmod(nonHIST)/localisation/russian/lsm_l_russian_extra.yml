 paranoia_idea: "Паранойя в Советском Союзе"
 paranoia_idea_desc: "Без ясного политического направления в Советском Союзе, пока его лидер, Иосиф Сталин, сеет подозрения в отношении каждого мужчины и женщины или, возможно, участвуя в политических невозможностях, которые Сталин презирает и подозревает, политика Советского Союза остаётся частично парализованной.\n\n§RЛюбые радикальные меры со стороны Советского Союза в этот период времени приведут к тяжёлым последствиям!§!"
