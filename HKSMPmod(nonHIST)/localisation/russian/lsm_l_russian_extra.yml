 LSM_startup.76.d: "§RТщательно подготовьтесь перед началом раунда:§! \n\n§RСтандартная Франция§!: Препятствовать только Франции в использовании фабричных обходов против игроков Германии (опция видна только Германии). \n\n§RИИ старается на полную§!: Не будет никаких ограничений для ИИ стран. \n§RИстория по умолчанию§!: наведите на опцию события, чтобы посмотреть список ограничений для ИИ."
