 LSM_new_world_diplomacy.15.t: "[SOV.GetAdjective] выборы [?global.year|0]"
 LSM_new_world_diplomacy.15.d: "После того как политическая буря в России наконец утихла, и было сформировано временное правительство, следующим шагом для нашей нации будут первые демократические выборы с выборов Всероссийского учредительного собрания 1917 года.\n\nЭти выборы станут символом новой эры для России, положив конец угрозе коммунизма и став завершающим аккордом на сцене истории для автократического империализма в России. Конечно, несмотря на горячие призывы к демократическим выборам, правда такова, что выборы в России будут \"демократически\" спланированы и согласованы всеми партиями.\n\nНо, возможно, со временем Россия снова станет действительно демократичной."
 LSM_new_world_diplomacy.15.a: "Триумф Белой России"
 LSM_new_world_diplomacy.15.b: "Керенский формирует правительство"
 LSM_new_world_diplomacy.15.c: "Единство под конституционной монархией"
 LSM_new_world_diplomacy.15.e: "Демократия в социализме"
 czech.37.t: "Большее содружество ради великого блага?"
 czech.37.d: "Наш союзник в [YUG.GetNameDef] предложил большее объединённое фронт для противостояния грядущей угрозе, исходящей со всего европейского континента. Для нас честь и долг дать им подходящий ответ."
 czech.37.a: "Больше не малые!"
 czech.37.b: "Никаких компромиссов с коммунистами!"
 czech.38.t: "Неудача предложения Великой Антанты"
 czech.38.d: "Наш бывший союзник в [CZE.GetNameDef] отклонил наше предложение о более мощном объединённом фронте. Возможно, пришло время для нашего государства начать собственный путь, преодолев все хрупкие союзы с этими шакалами!"
 czech.38.a: "Пансловянский Конгресс Рабочих!"
 LSM_czech.34.a: "Разве это не досадно?"
 LSM_czech.34.b: "Действительно досадно"
