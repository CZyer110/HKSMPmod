 LSM_patriotic_war_sabotage_pact: "Давайте пересмотрим наш пакт с [GER.GetNameDef]"
 LSM_patriotic_war_one_step_forward: "Война с [GER.GetNameDef]"
 LSM_GER_SOV.1.t: "Перекрёсток судьбы"
 LSM_GER_SOV.1.d: "Великая нация оказалась перед трудным выбором, где каждое решение несёт боль и жертвы. На востоке дремлет медведь, который может стать либо великим союзником, либо заклятым врагом. За морем скрываются богатства Нового Света и отвратительные режимы под руководством [ENG.GetLeader] и [USA.GetLeader], которые день за днём плетут заговоры, чтобы вернуться в Европу. Решение должно быть принято.\n\nКакой путь выберет [GER.GetNameDef]?"
 LSM_GER_SOV.1.a: "Западные берега"
 LSM_GER_SOV.1.b: "Восточный фронт"
 LSM_GER_SOV.2.t: "Телеграмма из Берлина"
 LSM_GER_SOV.2.d: "Сегодня утром мы получили письменное послание от агента, направленного [GER.GetNameDef], с официальным запросом на обсуждение будущего Европы. Хотя этот шаг не стал полной неожиданностью, учитывая состояние германской экономики и ход войны, где враги уже укрепились за пределами досягаемости, необходимо подготовиться к любому исходу для [SOV.GetNameDef]."
 LSM_GER_SOV.2.a: "Где встречаемся на этот раз?"
 LSM_GER_SOV.2.b: "Нас это не интересует"
 LSM_GER_SOV.3.t: "Они заинтересованы в нашем предложении"
 LSM_GER_SOV.3.d: "Сразу после обращения к [SOV.GetAdjective] правительству наш агент получил ответ: \"[SOV.GetLeader] готов вступить в переговоры с [GER.GetNameDef] в [GER.Capital.GetCapitalVictoryPointName]. Их дипломаты уже в пути. Возможно, стоит устроить праздник в честь этого события!\""
 LSM_GER_SOV.3.a: "Небольшого торжества будет достаточно"
 LSM_GER_SOV.3.b: "Прекрасно! Доставайте пиво!"
 LSM_GER_SOV.4.t: "Они отвергли наше предложение"
 LSM_GER_SOV.4.d: "После попытки выйти на контакт с [SOV.GetAdjective] правительством наш агент был схвачен и расстрелян. Его жертва не была напрасной – теперь мы знаем, что [SOV.GetNameDef] преследует иные цели в Европе, возможно, угрожающие нашему суверенитету."
 LSM_GER_SOV.4.a: "Барбаросса, значит..."
 LSM_GER_SOV.6.t: "Они предлагают нам союз"
 LSM_GER_SOV.6.d: "На роскошном приёме, лично организованном [GER.GetLeader], наши дипломаты получили неожиданное предложение, потребовавшее времени на обдумывание и консультации с [SOV.GetLeader]. Теперь, когда наша страна стоит на распутье, мы должны подойти к этому решению с предельной осторожностью."
 LSM_GER_SOV.6.a: "[SOV.GetLeader] присоединяется к торжеству"
 LSM_GER_SOV.6.b: "У нас есть лучший план"
 LSM_GER_SOV.5.t: "[GER.GetLeader] предлагает нам дружбу"
 LSM_GER_SOV.5.d: "На приёме, где присутствовали высокопоставленные члены [GER.GetAdjective] правительства, наши дипломаты получили ожидаемое предложение, которое полностью соответствовало прогнозам [SOV.GetLeader]. Однако дружба – это не всегда бескорыстное явление. Теперь, когда у нас хорошие позиции, мы должны играть осторожно и продуманно."
 LSM_GER_SOV.5.a: "Согласиться на пакт..."
 LSM_GER_SOV.5.b: "...но с условиями"
 LSM_GER_SOV.8.t: "[SOV.GetLeader] соглашается на новый договор"
 LSM_GER_SOV.8.d: "После контакта с [SOV.GetAdjective] дипломатами наше правительство получило положительный ответ: наши страны безоговорочно заключат пакт о ненападении, который вступит в силу сразу после подписания. [SOV.GetLeader] даже лично связался с [GER.GetLeader], поздравив его и выразив искренний интерес к процветанию Европы, [GER.GetNameDef] и [SOV.GetNameDef]."
 LSM_GER_SOV.8.a: "На них всегда можно положиться!"
 LSM_GER_SOV.9.t: "[SOV.GetLeader] выдвигает встречное предложение"
 LSM_GER_SOV.9.d: "После контакта с [SOV.GetAdjective] дипломатами наше правительство получило неоднозначный ответ. [SOV.GetNameDef] выразил интерес к некоторым вопросам, которые, по их мнению, может решить лишь [GER.GetLeader]: признание международных претензий [SOV.GetNameDef], находящихся под защитой [GER.GetNameDef], и передача нашего ценного боевого опыта. Мы можем удовлетворить их требования, обеспечив подписание договора, или же вернуться к изначальной стратегии."
 LSM_GER_SOV.9.a: "Признать их претензии"
 LSM_GER_SOV.9.b: "Помочь модернизировать их армию"
 LSM_GER_SOV.9.c: "Сделки не будет"
 LSM_GER_SOV.18.t: "[GER.GetLeader] признаёт наши претензии"
 LSM_GER_SOV.18.d: "Вскоре после нашего встречного предложения пришли радостные вести — [GER.GetNameDef] согласен признать любые территориальные притязания [SOV.GetNameDef] и приложит все возможные усилия, чтобы они были удовлетворены. Более того, если потребуется, он окажет поддержку в подавлении сопротивления в этих регионах.\n\nПохоже, настало время завершить наши дела в Европе."
 LSM_GER_SOV.18.a: "Теперь разговор идёт по делу"
 LSM_GER_SOV.19.t: "Они направят лучших советников"
 LSM_GER_SOV.19.d: "Вскоре после нашего встречного предложения пришли радостные вести — [GER.GetNameDef] поделится с нами всем своим военным опытом, полученным в войне в Европе. В рамках соглашения нам предложены программы по созданию новых академий, подготовка военных советников, военные учения, а также возможность для наших атташе участвовать в манёврах или даже на передовой."
 LSM_GER_SOV.19.a: "Теперь разговор идёт по делу"
 LSM_GER_SOV.10.t: "[GER.GetLeader] делает первый выстрел!"
 LSM_GER_SOV.10.d: "Переговоры сорваны! Дипломатическая связь прервана! Наши дипломаты и высокопоставленные офицеры, находившиеся в [GER.GetNameDef], были жестоко убиты без предупреждения.\n\n[SOV.GetLeader] был прав! [GER.GetNameDef] нельзя было доверять! Эти коварные змеи, мечтающие поглотить весь мир, должны быть уничтожены прежде, чем их яд отравит следующее поколение!"
 LSM_GER_SOV.10.a: "Жаль, но война неизбежна"
 LSM_GER_SOV.150.t: "Война на Восточном фронте"
 LSM_GER_SOV.150.d: "Переговоры сорваны. Дипломатическая связь прервана. [GER.GetLeader] был прав! [SOV.GetNameDef] нельзя было доверять! Ради будущих поколений мы должны добиться полной победы и уничтожить угрозу со стороны коммунистов!\n\nГанс, принеси огнемёт!"
 LSM_GER_SOV.150.a: "Жаль, но война неизбежна"
 LSM_GER_SOV.27.t: "Тревожная мобилизация на восточной границе!"
 LSM_GER_SOV.27.d: "В обход наших договорённостей [SOV.GetAdjective] правительство мобилизует миллионы солдат у наших границ. Линии связи замолчали, а наши военные советники в [SOV.GetNameDef] исчезли бесследно. Ожидали ли мы этого? Возможно, да. Возможно, нет."
 LSM_GER_SOV.27.a: "Времени мало! Нужно действовать!"
 LSM_GER_SOV.101.t: "Телеграмма Риббентропа"
 LSM_GER_SOV.101.d: "Канада, как и большая часть Британского Содружества, пока остаётся вне нашей досягаемости. Однако [USA.GetNameDef] находится куда ближе, а его судьба тесно переплетена с нашей. От него всего несколько шагов до Оттавы, где заседает кабинет [ENG.GetLeader]. Возможно, нам стоит обсудить это."
 LSM_GER_SOV.101.a: "Обсудить с [USA.GetLeader]"
 LSM_GER_SOV.101.b: "Глупости"
 LSM_GER_SOV.102.t: "Телеграмма Риббентропа"
 LSM_GER_SOV.102.d: "Этим утром мы получили телеграмму от европейских союзников, в которой они выражают обеспокоенность нашей политикой в Америке и предлагают оказать им услугу, разгромив оставшихся врагов. С одной стороны, это отличная возможность расширить границы и покончить с британским империализмом, с другой — мы тем самым усилим потенциального будущего противника. Нужно тщательно всё обдумать."
 LSM_GER_SOV.102.a: "Звучит разумно"
 LSM_GER_SOV.102.b: "Чушь"
 LSM_GER_SOV.102.c: "У меня есть идея получше"
 LSM_GER_SOV.26.t: "Телеграмма Риббентропа"
 LSM_GER_SOV.26.d: "Как и следовало ожидать, или, возможно, именно поэтому, [USA.GetLeader] отверг наше предложение и вместо этого пошёл на сближение с [CAN.GetAdjective] правительством. Хотя этот дипломатический манёвр стал для нас некоторым препятствием, он никак не влияет на наши планы. Континент Европа уже у нас в руках — кто теперь осмелится сказать, что мы ещё не хозяева мира?"
 LSM_GER_SOV.26.a: "Что ж, так тому и быть"
 lsm_news.1103.t: "Телеграмма Риббентропа"
 lsm_news.1103.d: "По неведомым причинам и неведомыми путями [GER.GetAdjective] правительство связалось с [USA.GetLeader] ранним утром, требуя вмешательства в дела Канады — сколь бы безумным это ни казалось.\nРазумеется, [USA.GetLeader], наслаждаясь своим завтраком и горячим шоколадом, не обратил внимания на жалкие мольбы несчастной души из [GER.Capital.GetCapitalVictoryPointName] и продолжил трапезу, словно ничего не произошло. Впрочем, перед этим он успел поручить правительству объявить свой план в отношении Европы и Америки, а также, обмолвившись лишним словом, отметил саму наглость [GER.GetAdjective] правительства, осмелившегося обратиться к нему."
 lsm_news.1103.a: "Я же говорил, что это плохая идея!"
 lsm_news.1103.b: "Выгодно во всех смыслах"
 lsm_news.1103.c: "Ха-ха, серьёзно?"
 economic_mobilisation_cat: "Экономическая мобилизация"
 lsm_news.120.t: "Японская победа в Китае"
 lsm_news.120.d: "Под руководством [JAP.GetLeader] Япония отправилась в амбициозный поход — вторжение в Китайскую Республику. Сегодня [JAP.GetAdjective] правительство официально объявило о своей окончательной победе.\n\nОсвободившись от войны с Китаем, Япония теперь оставляет мир в догадках о своём следующем шаге. Будет ли её взор обращён на Россию или на южные колонии западных держав — одно ясно наверняка: Япония неизбежно продолжит свой путь."
 lsm_news.120.g: "Тэнно: хэйка банзай!!"
 lsm_news.120.m: "Ниппон банзай!!"
 lsm_news.120.a: "Поздравляем"
 lsm_news.120.b: "Опасные времена"
 lsm_news.120.c: "Они идут"
 LSM_GER_SOV.472.t: "Вмешательство в Китае"
 LSM_GER_SOV.472.d: "Теперь, когда угроза в Европе уничтожена, наша страна вновь оказывается перед выбором: поддаться давлению или же рассматривать ситуацию как возможность присоединиться к войне в Азии в соответствии с договорённостями, достигнутыми на Ялтинской конференции с лидером союзников. Разумеется, это не обязательство как таковое — война в Европе слишком дорого нам обошлась. Однако возможность есть возможность.\n\nОтказаться от столь выгодного предприятия было бы безумием."
 LSM_GER_SOV.472.a: "Ураааа!"
 LSM_GER_SOV.472.b: "Мы не можем себе этого позволить"
 lsm_news.121.t: "Объединение Китая"
 lsm_news.121.d: "После месяцев кровопролитной гражданской войны Китайская Республика сегодня была вынуждена отступить на Тайвань, что ознаменовало конец боевых действий. Сопротивление, хоть и сохраняется в отдалённых районах, не представляет серьёзной угрозы, а без дальнейшей поддержки Запада становится очевидно, что передача власти в руки коммунистических победителей неизбежна.\n\nМногих эта новость повергла в шок, но для китайцев, изменится ли их жизнь или нет, одно ясно — гражданская война окончена."
 lsm_news.127.d: "После месяцев постоянной гражданской войны Республика Китай сегодня капитулировала перед [PRC.GetNameDef], что знаменует конец кровопролития в Китае. Сопротивление, хотя и продолжает существовать в удалённых районах, не представляет собой значительной угрозы, и без дальнейшей поддержки Запада для любого наблюдателя становится очевидно, что скоро произойдёт полная передача власти в руки коммунистических победителей.\n\nХотя многие до сих пор в шоке от этой ужасной новости, для китайского народа, означает ли это изменение их образа жизни или нет, Гражданская война в Китае, наконец, подошла к концу."
 lsm_news.121.a: "Поздравляем"
 lsm_news.121.b: "Что это значит для нас?"
 lsm_news.122.t: "Вторая гражданская война в Китае"
 lsm_news.122.d: "Так говорили в кулуарах, и так свершилось. Долгожданный, но неизбежный конфликт вспыхнул вновь.\n\nСегодня, на рассвете, [ROOT.GetAdjective] войска перешли реку и начали широкомасштабное наступление, полностью проигнорировав предостережения западных союзников о недопустимости нового военного кризиса в регионе. Для наблюдателей это не стало сюрпризом: бывший союз китайских государств был лишь временным и вынужденным, а как только главная угроза китайскому суверенитету исчезла, гражданская война снова подняла голову."
 lsm_news.122.a: "Удачи, товарищи!"
 lsm_news.122.b: "Но мирное население…"
 lsm_news.123.t: "Гражданская война в Корее"
 lsm_news.123.d: "Сегодня двадцать дивизий северокорейской пехоты пересекли границу Южной Кореи.\n\nВ узком смысле это лишь гражданская война внутри разделённой страны. В более широком — это разрыв в отношениях между двумя доминирующими блоками, возникшими после Второй мировой войны. Однако теперь, когда ядерное оружие стало реальностью, остаётся надеяться, что у обеих сторон хватит благоразумия проявить сдержанность."
 lsm_news.123.a: "За объединённую Корею!"
 lsm_news.123.b: "Да восторжествует свобода"
 lsm_news.124.t: "Вмешательство США в гражданскую войну в Корее"
 lsm_news.124.d: "США действовали, осознавая последствия каждого шага. Они знали, что война расширяется, когда [USA.GetLeader] отправил корабли и самолёты, а затем приказал бомбить базы коммунистов в Северной Корее. Когда американские войска заняли позиции, заменяя разбитые южнокорейские части, в обществе вновь возникло беспокойство, подобное тому, что предшествовало Батаану. Однако альтернатива была ясна — наблюдать, как одна за другой падают свободные нации.\n\nЛишь немногие осмелились протестовать против решений этой судьбоносной недели."
 lsm_news.124.a: "Подлые капиталисты!"
 lsm_news.124.b: "Да здравствует демократия!"
 lsm_news.125.t: "Китай вступает в войну!"
 lsm_news.125.d: "Угроза полномасштабной войны в Азии растёт: около 250 000 китайских коммунистов вступили в бой за северо-западную Корею. В лучшем случае их вмешательство означает затяжные зимние бои в горах, в худшем — мировую войну.\n\nМир затаил дыхание."
 lsm_news.125.a: "Победа за социализмом!"
 lsm_news.125.b: "Беззаконные ублюдки!"
 lsm_news.126.t: "Перемирие в Корее"
 lsm_news.126.d: "Пока на фронтах продолжались ожесточённые бои, в Пханмунджоме переговорщики стремительно приближались к соглашению о перемирии. В [?global.year|0] году все ключевые пункты были согласованы обеими сторонами. На следующий день началась работа по определению границ демилитаризованной зоны...\n\nСегодня в 11:00 генерал-лейтенант Уильям К. Харрисон-младший, главный представитель ООН на переговорах, подписал документы о прекращении огня. В то же самое время генерал Нам Иль поставил свою подпись от имени Северной Кореи."
 lsm_news.126.a: "Наконец-то конец войне..."
 lsm_news.126.b: "...пусть мир процветает"
 lsm_news.128.t: "Объединение Корейского полуострова"
 lsm_news.128.d: "С последним очагом сопротивления, наконец, нейтрализованным, соглашение по всем пунктам было достигнуто обеими сторонами в [?global.year|0]. На следующий день офицеры связи и штаба приступили к переговорам о обмене военнопленными, а также о восстановлении потерь. В 11:00 сегодня старший делегат Организации Объединённых Наций на мирных переговорах, генерал-лейтенант Уильям К. Харрисон младший, подписал условия договора. В то же время старший делегат Северной Кореи, генерал Нам Иль, поставил свою подпись на документах."
 lsm_news.128.a: "Наконец-то конец войне..."
 lsm_news.128.b: "...пусть мир процветает"
 LSM_new_world_diplomacy.6.t: "Нанкинский договор"
 LSM_new_world_diplomacy.6.d: "Теперь, когда Китай пал перед нами, нам предстоит решить, как управлять этой огромной территорией. Конечно, среди доступных нам вариантов или предложений для наших союзников стоит задуматься о будущем – как нашем, так и наших имперских подданных. С одной стороны, управление Китаем можно передать китайскому руководству под началом Пу И; с другой – поставить у власти Ван Цзинвэя. Ну или же просто оставить всё себе."
 LSM_new_world_diplomacy.6.a: "Разделить Китай с маньчжурами"
 LSM_new_world_diplomacy.6.b: "Восстановить императора Цин"
 LSM_new_world_diplomacy.6.c: "Маньчжурам нельзя доверять"
 LSM_new_world_diplomacy.6.e: "На карте нет ошибки"
 LSM_new_world_diplomacy.6.f: "Правление Ван Цзинвэя"
 LSM_GER_SOV.474.t: "Захвачен подозрительный человек"
 LSM_GER_SOV.474.d: "Сегодня утром в 06:00 этот человек пересёк наше воздушное пространство западнее [217.GetCapitalVictoryPointName], недалеко от границы с Казахстаном. Его самолёт, выглядевший весьма подозрительно, был сбит. Хотя он утверждал, что у него срочные дела и что он не хочет иметь с нами ничего общего, его нашли спрятавшимся в дымоходе."
 LSM_GER_SOV.474.a: "ГУЛАГ — лучший ответ"
 LSM_GER_SOV.474.b: "Отпустить его"
 LSM_GER_SOV.474.c: "Разве он не измождён? Пусть отдохнёт"
 LSM_GER_SOV.474.e: "Сначала допросить"
 LSM_GER_SOV.475.t: "Поставка угля?"
 LSM_GER_SOV.475.d: "Сегодня утром на улицах [ROOT.Capital.GetCapitalVictoryPointName] обнаружили огромную груду угля и записку, написанную, судя по всему, на языках северных республик [SOV.GetNameDef]. Разумеется, никто из опрошенных свидетелей или прохожих не смог объяснить, откуда взялся этот неожиданный дар. Кто бы ни был этот таинственный благодетель, его поступок доказывает, что воля народа крепка!"
 LSM_GER_SOV.475.a: "Пустим уголь в дело!"
 LSM_GER_SOV.475.b: "В этом году угля куда меньше?"
 LSM_GER_SOV.476.t: "Подозрительный человек"
 LSM_GER_SOV.476.d: "Поздним вечером, после того как его сопроводили к месту размещения вместе с его личными вещами, этот человек попытался обойти охрану и проникнуть в близлежащее село, где его, судя по всему... ждали дети? Хотя он не проявлял намерений похищать их или заниматься чем-то незаконным, его поведение остаётся весьма загадочным и требует внимания."
 LSM_GER_SOV.476.a: "Осторожность превыше всего"
 LSM_GER_SOV.476.b: "Может, он просто хотел поиграть с детьми"
 LSM_GER_SOV.477.t: "Подозрительный человек раскрыл свою личность"
 LSM_GER_SOV.477.d: "Вернувшись на базу к ужину, этот человек разглядывал список имён, который он носил с собой, но почти ничего не сказал о своих намерениях, лишь выразил желание поужинать с нами. Однако, когда все уселись за стол, он наконец раскрыл свою личность.\n\n'Меня зовут Санта-Клаус. Я — Отец Рождества.'\n\nВсе за столом опешили."
 LSM_GER_SOV.477.a: "Он шпион, противник нашего дела!"
 LSM_GER_SOV.477.b: "Приветствуем его в Советском Союзе"
 LSM_GER_SOV.477.c: "[SOV.GetLeader] узнаёт об этом инциденте"
 LSM_GER_SOV.478.t: "Санта-Клаус прощается"
 LSM_GER_SOV.478.d: "'Хо-хо-хо!'\n\nПод звонкий смех Санта-Клаус покидает деревню под радостные крики детей. Хотя он выглядел обеспокоенным повреждёнными санями, его, по крайней мере, радовало, что олени не пострадали.\n\nКонечно, Советский Союз предостерёг его от повторного нарушения воздушного пространства, но, учитывая, что он живёт где-то на Северном полюсе, встреча, вероятно, повторится с приходом зимы."
 LSM_GER_SOV.478.a: "Благословение Санта-Клауса"
 LSM_GER_SOV.479.t: "Допрос, часть 1 — Список"
 LSM_GER_SOV.479.d: "Мы нашли список имён! Несомненно, это шпионы капиталистических свиней и гнусных нацистов! Подозреваемому придётся долго объясняться, в противном случае он отправится в ГУЛАГ, чтобы искупить свою вину за шпионаж против Советского Союза!"
 LSM_GER_SOV.479.a: "Кто такая Малышка Джессика?!"
 LSM_GER_SOV.479.b: "У него есть и второй список"
 reduced_xp_gain: "Страна в мире"
 increased_xp_gain: "Страна в войне"
 LSM_GER_SOV.480.t: "Допрос, часть 2 — Послание"
 LSM_GER_SOV.480.d: "Мы нашли ещё один список имён, но этот человек угрожает нам, говоря, что внесёт наши имена в него. Это список целей для ликвидации?!\n\nВ его кармане обнаружен свёрнутый лист бумаги:\n\n'Дорогой Санта. Дорогой Санта, я была хорошей девочкой. Я тружусь, как белка в колесе.'"
 LSM_GER_SOV.480.a: "Это явно зашифрованное сообщение!"
 LSM_GER_SOV.480.b: "Кто такой Санта?!"
 LSM_GER_SOV.481.t: "Допрос, часть 3 – Шпионский самолёт"
 LSM_GER_SOV.481.d: "У этого человека был истребитель, который не отразился на радарах. У него не было крыльев и винта, но он двигался с такой же скоростью, как новейшие советские боевые машины. Подозреваемый не дал внятного ответа, а наши угрозы оказались бессильны против него. Более того, он откуда-то знал имена детей командира базы, откуда у него эта информация!?"
 LSM_GER_SOV.481.a: "Откуда ты знаешь Таню и Василия!?"
 LSM_GER_SOV.481.b: "Что ты делаешь в Советском Союзе?"
 LSM_GER_SOV.482.t: "Допрос, часть 4 – Подарок"
 LSM_GER_SOV.482.d: "'Подарки! Я разношу подарки!' – этот человек, называющий себя Санта-Клаусом, отчаянно твердил, что его призвание – дарить детям по всему миру подарки... бесплатно? Как такое вообще возможно?"
 LSM_GER_SOV.482.a: "Чушь! В тюрьму его!"
 LSM_GER_SOV.482.b: "Так ты, выходит, коммунист?"
 LSM_GER_SOV.483.t: "Санта-Клаус – коммунист?"
 LSM_GER_SOV.483.d: "'Да! А почему, по-твоему, я ношу красное, товарищ?'\n\nТеперь сомнений нет – он один из нас! Кто ещё мог бы быть столь щедрым и преданным обществу, если не настоящий коммунист?"
 LSM_GER_SOV.483.a: "Товарищ, две водки, печенье и молоко."
 LSM_GER_SOV.500.t: "Пойман подозрительный человек"
 LSM_GER_SOV.500.d: "Сегодня в 04:00 этот человек пересёк воздушное пространство Германии к востоку от [GER.Capital.GetCapitalVictoryPointName], после чего был сбит в своём странном летательном аппарате. Хотя он утверждал, что у него неотложные дела и он не имеет к нам никакого интереса, его нашли прячущимся... в дымоходе."
 LSM_GER_SOV.500.a: "Шпионов – к стенке!"
 LSM_GER_SOV.500.b: "Отпустить его."
 LSM_GER_SOV.500.c: "Человек устал... пусть отдохнёт."
 LSM_GER_SOV.501.t: "Ужин с [SOV.GetLeader]"
 LSM_GER_SOV.501.d: "Вопреки ожиданиям, [SOV.GetLeader] принял этого чужака с теплотой, хотя его образ жизни противоречил всему, за что выступает Советский Союз. Однако к вечеру их знакомство переросло в настоящую дружбу, и Санта-Клаус даже предложил приготовить ужин для нашего вождя. Разумеется, НКВД настаивает, что это слишком опасно – кто знает, не планирует ли этот человек покушение на [SOV.GetLeader]?\n\nЧто предпримет НКВД?\n\nСтоит ли позволить Санте приготовить ужин?"
 LSM_GER_SOV.501.a: "Во славу Сталина!"
 LSM_GER_SOV.501.b: "Пусть готовит."
 LSM_GER_SOV.502.t: "Лучший ужин в истории!"
 LSM_GER_SOV.502.d: "Торжественно объявляя Санту-Клауса лучшим шефом [SOV.GetNameDef], [SOV.GetLeader] танцует и пьёт всю ночь напролёт. Никто из них не ожидал найти родственную душу в этом огромном мире. По крайней мере, для [SOV.GetLeader] это лучший ужин в его жизни! Еда была великолепна, восхитительна, она была лучше, чем он мог бы мечтать! Если бы только можно было получить ещё порцию!"
 LSM_GER_SOV.502.a: "[SOV.GetLeader] сыт."
 LSM_GER_SOV.502.b: "Ещё одну порцию!"
 LSM_GER_SOV.503.t: "Смерть [SOV.GetLeader]"
 LSM_GER_SOV.503.d: "[SOV.GetLeader] объелся так, что его тело не выдержало. Он надорвался окончательно, захлебнувшись в собственных желаниях. В преддверии заката своей жизни он с трудом шепчет последние слова. Вначале его голос слаб, но в нём чувствуется решимость."
 LSM_GER_SOV.503.a: "Сталин назначает Санту своим преемником."
 LSM_GER_SOV.503.b: "Товарищ Сталин пережил это испытание."
 SOV_santa_claus: "Санта-Клаус"
 father_christmas: "Дед Мороз"
 LSM_GER_SOV.504.t: "Санта-Клаус: Последний суд"
 LSM_GER_SOV.504.d: "Санта-Клаус обвинён в покушении на [SOV.GetLeader] и теперь должен предстать перед правосудием. Хотя сам [SOV.GetLeader] настаивает на полном оправдании, НКВД опасается, что если его отпустить, в будущем это может поставить вождя под угрозу. Кого же он послушает? Мольбы Санта-Клауса и внутренний порыв простить друга, или здравый смысл, требующий отправить этого человека в ГУЛАГ?"
 LSM_GER_SOV.504.a: "В ГУЛАГ его!"
 LSM_GER_SOV.504.b: "Невиновен по всем обвинениям!"