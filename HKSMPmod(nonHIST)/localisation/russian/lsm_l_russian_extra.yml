 SWE_cut_the_trade: "Прекратить торговое соглашение с Германией"
 FRA_research_boost: "Контакты с Францией"
 FRA_research_boost_desc: "Наши контакты из Франции были извлечены вместе с документами самой высокой секретности из захваченных [GER.GetAdjective] складов во время войны.\n\nК счастью, наши §Cдружеские отношения с [FRA.GetNameDef]§! позволили провести этот обмен."
 LSM_new_world_diplomacy.7.t: "Кризис Вастергёттена"
 LSM_GER_SOV.473.t: "Груз из Франции"
 LSM_GER_SOV.473.d: "После крушения французского правительства бесчисленные документы самой высокой секретности были эвакуированы, многие из которых попали в руки наших контактов во Франции, а в некоторых случаях — были переданы французским исследовательским отделом. Учитывая быстрое развитие ситуации на фронте, правительство [SOV.GetAdjective] было призвано действовать с осторожностью и полной срочностью, соблюдая секретность данного обмена."
 LSM_GER_SOV.473.a: "Раскрой секрет"
 LSM_new_world_diplomacy.7.d: "Сегодня утром телеграмма от нашего консульства в Швеции сообщила, что шведское правительство захватило шахты Вастергёттена, на которые ранее был передан доступ Германии, и наложило дипломатические санкции на наших дипломатов. Этот шаг правительства Швеции нарушил наши предыдущие условия и, безусловно, помешал дипломатическим процессам между нашими странами. Однако теперь, когда шведское правительство больше не заинтересовано в дальнейших деловых отношениях с нами, возможно, нам стоит предпринять решительные меры для отстаивания наших прав."
 LSM_new_world_diplomacy.7.a: "Что будет, то будет"
 LSM_new_world_diplomacy.7.b: "Мы требуем справедливости!"
 manchurian_lease: "Японская аренда китайских территорий"
 manchurian_lease_desc: "Японское правительство считает, что некоторые регионы Китая должны быть под его контролем и использоваться для военных нужд в течение следующих пяти лет. По истечении срока аренды все китайские территории, находящиеся под японским контролем, будут переданы [MAN.GetNameDef]."
 manchurian_lease_not_hidden: "Японская аренда китайских территорий"
 manchurian_lease_not_hidden_desc: "Японское правительство считает, что некоторые регионы Китая должны быть под его контролем и использоваться для военных нужд в течение следующих пяти лет. По истечении срока аренды все китайские территории, находящиеся под японским контролем, будут переданы [MAN.GetNameDef]."
 manchurian_integration: "Японская интеграция китайских территорий"
