 LSM_startup.2.t: "Проклятая карта"
 LSM_startup.2.d: "Кто-то сказал мне, что в 1941 году Черчилль умолял Сталина вступить в войну, потому что Гитлер был так близок к разрушению армии США. Так что я делаю это реальностью"
 LSM_startup.2.a: "Чёрт возьми, что за баг?"
 LSM_startup.2.b: "Нет, лол"
 lsm_news.1999.t: "Заговор в Африке"
 lsm_news.1999.d: "Сегодня утром правительство [ITA.GetAdjective] объявило о полной капитуляции Эфиопии, а также о полном аннексировании её правительства с целью создания заговора (либо из-за того, что советские добровольцы убили их, либо потому что Эфиопия позже станет огромной головной болью). В качестве компенсации страны, поддержавшие Эфиопию, получат рабочую силу, оборудование, опыт армии, и, надеемся, это немного смягчит гнев игроков. Надеемся, так будет."
 lsm_news.1999.a: "Кому это интересно?"
 lsm_news.1999.b: "Компенсация - это хорошо"
 lsm_news.1999.c: "Нет, отпустите Эфиопию, они победили"
 lsm_news.300.t: "Конечная победа!"
 lsm_news.300.d: "Я спрашиваю вас: хотите ли вы тотальную войну? Если потребуется, хотите ли вы более тотальную и радикальную войну, чем вы вообще можете сегодня представить?! Nun, Volk, steh auf, und Sturm, brich los! Ну же, народ, вставай, и буря, разразись!\n\nЯ ожидаю, что каждый немец выполнит свой долг до конца, и что он будет готов принять на себя все жертвы, которые ему предстоит понести; Я ожидаю, что каждый годный к службе немец будет с полным пренебрежением к собственной безопасности сражаться до последнего; Я ожидаю, что больные и слабые или те, кто не может служить в армии, будут работать до последней силы; я ожидаю, что все женщины и девушки будут продолжать поддерживать эту борьбу с высочайшим фанатизмом!"
 lsm_news.300.a: "Интересное развитие"
 lsm_news.300.b: "За освобождение Европы!"
 lsm_news.300.c: "Для защиты Рейха!"
 GER_doomsday_barbarossa: "Операция Барбаросса"
 LSM_great_patriotic_war_decision: "Война на Восточном фронте"
 lsm_news.1101.t: "Война в Европе"
 lsm_news.1101.d: "Связь между [GER.GetNameDef] и [SOV.GetNameDef] разрушена, армии стягиваются к границе, готовясь к континентальному столкновению, которое решит судьбу Европы.\n\nНа этом этапе слишком рано говорить о том, кто выйдет победителем из этого конфликта; однако одно ясно: независимо от исхода, возможно, это будет мир Европы — ведь никаких других угроз не будет, когда пыль оседает."
 lsm_news.1101.a: "Урааа!"
 lsm_news.1101.b: "За нашего великого вождя [GER.GetLeader]!!"
 lsm_news.1101.c: "Тревожное развитие"
 lsm_news.1200.t: "Следующее утро в Европе"
 lsm_news.1200.d: "Сегодня история стала свидетелем того, что раньше казалось невозможным.\n\nПосле нескольких раундов переговоров, [GER.GetNameDef] и [SOV.GetNameDef] заключили пакт о ненападении и невмешательстве в дела континентальной Европы, чтобы обеспечить мир для всех её граждан и будущее Старого мира. Хотя пока рано говорить о планах сторон, теперь, когда они полностью свободны от дрязг между собой, одно ясно: Новый мир теперь в опасности."
 lsm_news.1200.a: "У них было хорошее пиво"
 lsm_news.1200.b: "У них были хорошие медведи"
 lsm_news.1200.c: "Тревожное развитие?"
 lsm_news.1300.t: "Следующее утро в Европе"
 lsm_news.1300.d: "Сегодня история стала свидетелем того, что невозможно было даже представить.\n\nВсего за ночь, [GER.GetNameDef] и [SOV.GetNameDef] заключили альянс, и [GER.GetLeader] и [SOV.GetLeader] поделились ужином, а также объявили о братстве между теми, кого они назвали «единомышленниками». Только время покажет, к чему эти два человека приведут мир своими амбициями."
 lsm_news.1300.a: "Новый друг, действительно!"
 lsm_news.1300.b: "Новый друг, возможно!"
 lsm_news.1300.c: "Невозможно!"
 lsm_news.1110.t: "Напряжение в Восточной Европе"
 lsm_news.1110.d: "Несмотря на обновлённый договор дружбы и братства между двумя лидерами, [GER.GetLeader] и [SOV.GetLeader], обстоятельства лишь подогрели призывы к войне между [SOV.GetNameDef] и [GER.GetNameDef]. Связь между ними разрушена, и армии теперь стягиваются к границе, не остаётся сомнений, что это континентальное столкновение решит судьбу Европы.\n\nТот, кто выйдет победителем, возможно, станет новым Владыкой мира."
 lsm_news.1110.a: "Проклятые немцы!"
 lsm_news.1110.b: "Проклятые славяне!"
 lsm_news.1110.c: "Говорил же, что это глупо"
 lsm_news.1110.e: "Как и следовало ожидать"
 lsm_news.1111.t: "Шаг вперёд"
 lsm_news.1111.d: "Сегодня утром армия и авиация [SOV.GetAdjective] пересекли границу между [SOV.GetNameDef] и [GER.GetNameDef], начав крупномасштабное вторжение с восточного фланга в восходящую силу Центральной Европы. Этот неожиданный шаг поверг в шок зрителей, большинство из которых не могли даже представить такую массовость вторгающихся войск. Однако в [SOV.GetNameDef] рассказ был ясен: \n\nЕдинственная возможность для [SOV.GetNameDef] защитить себя от будущей агрессии — это сделать Шаг вперёд."
 lsm_news.1111.a: "На Берлин!"
 lsm_news.1111.b: "За Отечество!"
 lsm_news.1111.c: "Опасное время"
 lsm_news.1111.e: "На помощь нашим союзникам!"
