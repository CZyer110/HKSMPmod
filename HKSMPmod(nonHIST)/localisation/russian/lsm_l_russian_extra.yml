 LSM_startup.11.g: "Машинный Бог"
 LSM_startup.3.t: "Советская пехота"
 LSM_startup.3.d: "На самом деле это дебаг-ивент, который я использую для тестирования производительности Советской армии с разными доктринами. Так как мод в разработке, можно так сделать. Однако сейчас ИИ использует только одну упрощённую шаблонную пехоту, поэтому я ещё не добавил опции для них, чтобы они использовали отдельные шаблоны для защиты и нападения."
