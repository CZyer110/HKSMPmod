 LSM_startup.1.t: "Советская пехота"
 LSM_startup.1.d: "На самом деле это отладочное событие, которое я использую для тестирования производительности Советского Союза с разными доктринами. Так как мод находится в разработке, можно это сделать. Однако на данный момент ИИ использует только один упрощённый шаблон для простоты, и я ещё не добавил опции и веса для них, чтобы они делали разные шаблоны для обороны и нападения.\n\n§RДругие тестовые сборки:§! Массовая пехота – чистая пехота + авиация (возможно, потребуется тест против неё) или просто большое количество танков (может вызвать баги)"
 LSM_startup.1.a: "Превосходство огневой мощи (Лёгкий)"
 LSM_startup.1.b: "Крупномасштабное планирование (Лёгкий)"
 LSM_startup.1.c: "Массированный штурм (По умолчанию)"
 LSM_startup.12.a: "Пусть природа течёт, как хочет"
 LSM_startup.12.b: "Инстинктивное уничтожение"
 LSM_startup.12.c: "Порядок Рыцаря"
 LSM_startup.100.t: "Настройки по умолчанию"
 LSM_startup.100.d: "Хотите ли вы включить спавны милиции и прочее? Это активирует различные решения для ИИ и игроков, такие как усиление экономической мобилизации, увеличение спавнов милиции во время Endsieg, изменение поведения некоторых ИИ до определённой степени и в зависимости от ситуации, СССР получит усиления.\n\nЭто усложнит игру для некоторых ИИ, например, ИИ Японии может вообще не победить Китай.\n\nЭто можно будет отключить позже через систему решений.\n\n\n\n§RГермания получит огромный, но исчезающий бонус в начале мировой войны, если это будет включено на момент войны.§!\n\nСерьёзно, просто выберите Отключить, чтобы вы могли умереть без лишних оправданий.\n\nЧёрт, скоро уберу это – что я и сделал! Это будет появляться время от времени для тестирования, пока люди не поймут, что мод легче, если это включено."
 LSM_startup.100.a: "Отключено (По умолчанию)"
 LSM_startup.100.b: "Включено (НЕ рекомендуется)"
 LSM_startup.101.t: "Экспериментальная броня для Германии"
 LSM_startup.101.d: "Дебаг-ивент для проверки, сможет ли Германия в будущем перейти на броню, чтобы победить Советский Союз, так как они не справляются с ИИ СССР иначе."
 LSM_startup.101.a: "Отключено (По умолчанию)"
 LSM_startup.101.b: "Включено (Может не сработать, но ладно)"
 LSM_startup.10.t: "Германская доктрина"
 LSM_startup.10.d: "На самом деле это дебаг-ивент, который я использую для тестирования производительности ИИ Германии с разными доктринами. Так как мод в разработке, можно так сделать.\n\n§RГерманский ИИ по доктрине массированного штурма.§!"
