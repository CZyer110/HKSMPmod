l_russian:
 ruthless_commander_trait: "Безжалостный командир\n(Гений)"
 character_promotion.1.t: "Фердинанд Шёрнер запрашивает перевооружение"
 character_promotion.1.d: "После изменения нашей военной доктрины один из наших самых преданных военных командиров, Фердинанд Шёрнер, обратился в Генеральный штаб с предложением по созданию артиллерийской дивизии. Шёрнер, наиболее известный своей жестокостью и безжалостной тенденцией, считает, что способен раскрыть потенциал нашей новоучрежденной доктрины."
 character_promotion.1.a: "Жестокий человек, жестокая битва"
 character_promotion.1.b: "Оставим его на нынешней должности."
 character_promotion.2.t: "Конец безжалостности"
 character_promotion.2.d: "Сегодня утром, инспектируя фронт, Фердинанд Шёрнер, как сообщается, стал жертвой несчастного случая, в результате которого скончался. Обстоятельства инцидента неясны, и сведений о времени его смерти крайне мало."
 character_promotion.2.a: "Неудачный исход"
 character_promotion.3.t: "Триумфальный идеолог"
 character_promotion.3.d: "Несмотря на политические изменения в бывших Соединенных Штатах Америки, риторическая и идеологическая революция в сознании народа [USA.GetAdjective] привела к возрождению [USA.GetNameDef], и человек, стоящий за нашей национальной революцией, теперь стал прародителем нового мира Америки."
 character_promotion.3.a: "Триумф Нового Мира"
 USA_fascist_revolutionary: "Фашистский революционер"
 USA_syndicalist_vanguard: "Синдикалистский авангард"