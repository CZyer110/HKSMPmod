 USA_support_CAN: "Мы должны принять предложение и извлечь из него выгоду."
 GER_SOV_1_tt: "Вы и члены вашей фракции получите доступ к морскому решению для переправы через Атлантику, если [SOV.GetNameDef] согласится на новый договор."
 GER_SOV_2_tt: "Переправа через Атлантику будет недоступна, пока [SOV.GetNameDef] не будет подчинён."
 GER_SOV_3_tt: "Мы начнём переговоры с [FROM.GetNameDef]."
 GER_SOV_4_tt: "Никаких переговоров с мерзким [FROM.GetNameDef]."
 GER_SOV_5_tt: "Мы не ожидали ничего другого."
 GER_SOV_6_tt: "Мы ожидаем, что [SOV.GetNameDef] будет держаться от нас подальше в течение следующих пяти-десяти лет."
 GER_SOV_7_tt: "Альянс — наша единственная надежда на полную победу."
 GER_SOV_8_tt: "Конечно, да."
 GER_SOV_9_tt: "Только при условии"
 GER_SOV_10_tt: "Признать их международные претензии. Все претензии [SOV.GetNameDef], находящиеся под нашей защитой, будут переданы и обменены, а их другие интересы в Европе будут обеспечены."
 GER_SOV_11_tt: "Отменить это. Значит, война. О, и убейте [SOV.GetAdjective] дипломатов, пожалуйста."
 GER_SOV_12_tt: "Финляндия и линия Молотова, а также другие международные претензии."
 GER_SOV_13_tt: "Армия [SOV.GetAdjective] получит нашу гарантированную поддержку для модернизации и улучшения производства, а также повышения её эффективности."
 GER_SOV_14_tt: "Модернизация армии и промышленности [SOV.GetNameDef]."
 GER_SOV_15_tt: "Значит, война."
