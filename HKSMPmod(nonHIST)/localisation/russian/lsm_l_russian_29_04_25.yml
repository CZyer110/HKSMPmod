 select_designated_state_tt: "Выбранный регион будет использоваться для координации стратегии фронта с союзниками. Пока можно назначить только один регион — в целях отладки."
 clear_designated_state_tt: "Выбранный регион больше не будет назначен для координации с членами фракции в рамках дипломатических действий по стратегии на фронте. В настоящее время может быть назначен только один регион."
