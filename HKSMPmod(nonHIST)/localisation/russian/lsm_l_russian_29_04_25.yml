 enable_frontline_selection_tt: "Позволяет выбрать конкретную цель. Сброс флага назначения вернёт стратегию ИИ к стандартному режиму."
 disable_frontline_selection_tt: "Отключить выбор назначенной цели. Сбросьте флаг назначения, чтобы вернуть стратегию ИИ к обычному поведению."
 select_designated_country_tt: "Выбранная страна будет назначена для координации стратегии фронта с союзниками. В настоящее время можно назначить только одну страну — в целях тестирования багов."
 clear_designated_country_tt: "Выбранная страна больше не будет назначена для координации с членами фракции в рамках дипломатических действий по стратегии на фронте. В настоящее время может быть назначена только одна страна."
 enable_designated_state_tt: "Разрешить выбор цели для отдельных регионов. Сброс флага назначения вернёт стратегию ИИ к стандартному режиму."
