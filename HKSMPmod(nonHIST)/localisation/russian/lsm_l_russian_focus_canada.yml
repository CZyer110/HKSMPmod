l_russian:
 CAN_anti_imperialist_revolutionary: "Антиимпериалистическая революционерка"
 CAN_beacon_of_liberty: "Маяк свободы"
 CAN_fascism_ideologue: "Идеолог милитаризма"
 CAN_state_of_emergency: "Чрезвычайное положение"
 CAN_state_of_emergency_desc: "Канаду угрожает вторжение. Каждый годный к службе человек должен быть зачислен в армию или работать на фабрике. Час расплаты настал."
 CAN_mobilise_the_university: "Мобилизация студентов"
 CAN_mobilise_the_university_desc: "Несмотря на наш превосходный боевой дух, наша скромная армия не сможет сопротивляться захватчикам в одиночку. Нам нужно начать мобилизацию университетских студентов, если мы хотим выжить в этой мучительной битве."
 CAN_a_call_for_help: "Призыв о помощи"
 CAN_a_call_for_help_desc: "Враги неумолимы, и наш народ будет страдать от затяжной войны. Канада должна начать дипломатическую миссию, чтобы заручиться поддержкой международного сообщества."
 CAN_mobilised_the_university: "Мобилизованная молодёжь"
 CAN_canadian_destiny: "Канадская судьба"
 CAN_canadian_destiny_desc: "Для народа Канады наступает новая эра. Время пришло для того, чтобы сделать наши собственные шаги за пределы планов, составленных короной."
 CAN_treaty_of_kinship: "Договор о родстве"
 CAN_treaty_of_kinship_desc: "Народы [CAN.GetNameDef] и [ENG.GetNameDef] имеют общие корни. Поэтому наши нации должны развивать сотрудничество на равных."
 CAN_no_longer_home: "Больше не наш дом"
 CAN_no_longer_home_desc: "Остров Британия и наша канадская нация в Новом Свете выбрали разные пути. Время покажет, смогут ли наши народы когда-либо помириться, но сейчас наши нации столкнутся в ближайшем будущем."
 CAN_true_revolution_effect_tt: "Волна иммиграции накроет Канаду со стороны всех немарксистских стран мира."