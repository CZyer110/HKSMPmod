 idea_EGY_army_of_egypt: "Строгий нейтралитет"
 idea_EGY_army_of_egypt_desc: "Руководство Египта не поддерживает Великобританию."
 LSM_new_world_diplomacy.44.t: "Суэцкий гарнизон принимает нашу защиту"
 LSM_new_world_diplomacy.44.d: "После гражданской войны на Британских островах гарнизон Суэца, оказавшийся в изоляции посреди идеологического противостояния, сдал контроль над Суэцем по требованию [EGY.GetAdjective] правительства.\n\nВновь Королевство Египет едино."
 LSM_new_world_diplomacy.44.a: "Наконец-то мы едины!"
 LSM_new_world_diplomacy.45.t: "Суэцкий гарнизон дезертирует"
 LSM_new_world_diplomacy.45.d: "Несмотря на путаность и противоречивость сообщений, сегодня утром стало известно, что гарнизон Суэца сдался и перешёл под египетский контроль - это знаменует конец британского господства в регионе, особенно на фоне ухода Египта и других протекторатов, вызванного новостями о нашей гражданской войне."
 LSM_new_world_diplomacy.45.a: "Предательство!"
 LSM_new_world_diplomacy.46.t: "Суэцкий ультиматум"
 LSM_new_world_diplomacy.46.d: "Британское правительство выдвинуло ультиматум по поводу контроля над Суэцким каналом: сдаться - или быть уничтоженными."
 LSM_new_world_diplomacy.46.a: "Мы подчинимся"
 LSM_new_world_diplomacy.46.b: "Арабы, объединяйтесь!"
 LSM_new_world_diplomacy.47.t: "Суэцкий договор"
 LSM_new_world_diplomacy.47.d: "Египетское правительство уступило нашему ультиматуму и вернуло контроль над Суэцким каналом Британии, сославшись на своё стремление к дружбе и защите в регионе - с чем британские дипломаты охотно согласились"
 LSM_new_world_diplomacy.47.a: "Как и должно быть"
 LSM_new_world_diplomacy.48.t: "Патовая ситуация в Суэце"
 LSM_new_world_diplomacy.48.d: "Египетское правительство проигнорировало наш ультиматум и, более того, выдворило наших дипломатов из-за переговорного стола в Суэце - шаг, в котором отчётливо проявилась их враждебная позиция по отношению к Британии.\n\nВ парламенте прозвучал призыв к войне: политики и военные ожидают ответного удара в ближайшие дни."
 LSM_new_world_diplomacy.48.a: "Значит, война"
 uk_suez_retake_focus: "Суэцкий ультиматум"
 uk_suez_retake_focus_desc: "Контроль над Суэцом должен вернуться Британии — словом или мечом"