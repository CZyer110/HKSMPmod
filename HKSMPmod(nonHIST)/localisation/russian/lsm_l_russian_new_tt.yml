 LSM_new_world_diplomacy.41.t: "[URG.GetNameDef] предлагает федеральное объединение"
 LSM_new_world_diplomacy.41.d: "Наш союзник в Южной Америке, [URG.GetLeader], предложил нам передать территории, ранее принадлежавшие федерации, преемником которой стал [URG.GetNameDef], с целью укрепления своей экономики и промышленного потенциала.\n\n[URG.GetLeader] гарантирует нашей стороне соответствующую компенсацию, а также сохранение всех прав для населения этих регионов."
 LSM_new_world_diplomacy.41.a: "Конечно, почему бы и нет?"
 LSM_new_world_diplomacy.41.b: "Теперь это наша земля"
