 LSM_new_world_diplomacy.42.t: "Крах A.O.I."
 LSM_new_world_diplomacy.43.d: "Ливийский военный округ больше не в силах сдерживать давление на фронте — командная структура рухнула, и в ближайшее время он будет полностью поглощён нашей регулярной армией."
 LSM_new_world_diplomacy.42.d: "Корпус Итальянской Восточной Африки больше не в силах сдерживать давление на фронте — командная структура рухнула, и в ближайшее время он будет полностью поглощён нашей регулярной армией."
