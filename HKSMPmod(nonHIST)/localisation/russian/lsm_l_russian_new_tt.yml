 lsm_news.93.t: "Лига Наций"
 lsm_news_ENG_FRA.93.d: "Германия, ставшая угрозой после Великой войны, объявила войну государству-члену Лиги Наций. В ответ [ENG.GetNameDef] и [FRA.GetNameDef] теперь собираются начать военное вмешательство для сохранения мира, который был найден после предыдущего континентального конфликта. Только с течением времени можно будет сказать, правильное ли Европа приняла решение."
 lsm_news_ENG_only.93.d: "Германия, ставшая угрозой после Великой войны, объявила войну государству-члену Лиги Наций. В ответ [ENG.GetNameDef] теперь собираются начать военное вмешательство для сохранения мира, который был найден после предыдущего континентального конфликта. Только с течением времени можно будет сказать, правильное ли Европа приняла решение."
 lsm_news_FRA_only.93.d: "Германия, ставшая угрозой после Великой войны, объявила войну государству-члену Лиги Наций. В ответ [FRA.GetNameDef] теперь собираются начать военное вмешательство для сохранения мира, который был найден после предыдущего континентального конфликта. Только с течением времени можно будет сказать, правильное ли Европа приняла решение."
 lsm_news_no_ENG_FRA.93.d: "Германия, ставшая угрозой после Великой войны, объявила войну государству-члену Лиги Наций. Однако ни [ENG.GetNameDef], ни [FRA.GetNameDef] ещё не отреагировали военным вмешательством. Только с течением времени можно будет сказать, правильное ли Европа приняла решение."
 lsm_news_GER_war.93.d: "В ответ на наше объявление войны государству-члену Лиги Наций западные гаранты отреагировали и объявили войну нам.\n\nТолько время покажет, правильно ли фюрер поступил, поспешив с его планом расширения... или, возможно, [GER.GetNameDef] слишком торопился, и ему следовало бы расширяться медленно, мирным путём, навязывая свою волю слабым соседям через дипломатию..."
 lsm_news_GER_easy.93.d: "Германия, ставшая угрозой после Великой войны, объявила войну государству-члену Лиги Наций. Однако ни [ENG.GetNameDef], ни [FRA.GetNameDef] ещё не отреагировали военным вмешательством. Только с течением времени можно будет сказать, правильное ли Европа приняла решение."
 lsm_news.93.a: "Разве мы тоже не являемся членами?"
 lsm_news.93.b: "Интересное время."
 lsm_news.93.c: "Паразиты!"
 lsm_news_93_tt: "Фюрер, возможно, слишком торопился с его планом расширения и переоценил своё влияние на мировой арене... §RЛига Наций всё ещё эффективна§!"
