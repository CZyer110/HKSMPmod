l_russian:
 NONHIST_AI_BEHAVIOR: "Неисторичное поведение ИИ"
 RULE_OPTION_DEFAULT_NONHIST_AI_DESC: "На ИИ не будут накладываться конкретные правила."
 RULE_OPTION_HISTORICAL_PATHS: "Относительно исторический"
 RULE_OPTION_HISTORICAL_PATHS_NONHIST_AI_DESC: "Страны будут оставаться относительно историческими в выборе фокусов, однако у некоторых стран могут быть конкретные планы фокусов, предназначенные для следования историческому пути, даже в неисторичной игре. ИИ всё равно будет отклоняться от пути в ответ на изменения политической ситуации."
 RULE_OPTION_MAJORS_ONLY: "Только большие страны"
 RULE_OPTION_MAJORS_ONLY_NONHIST_AI_DESC: "Только крупные страны ИИ могут отклоняться от исторических путей, мелкие страны могут реагировать."
 RULE_OPTION_MINORS_ONLY: "Только малые страны"
 RULE_OPTION_MINORS_ONLY_NONHIST_AI_DESC: "Только малые страны ИИ могут отклоняться от исторических путей, крупные страны могут реагировать."
 RULE_OPTION_ANTI_HISTORICAL: "Анти-исторический"
 RULE_OPTION_ANTI_HISTORICAL_NONHIST_AI_DESC: "Всё, что не является историческим, будет приемлемо."
 RULE_OPTION_NO_GAME_BALANCE: "Без баланса игры"
 RULE_OPTION_NO_GAME_BALANCE_NONHIST_AI_DESC: "Баланс идеологий в Vanilla будет удалён. Некоторые страны могут всё же иметь фокус с весами."
 NONHIST_GENERIC_AI_BEHAVIOR: "Участие стран в общем ИИ"
 RULE_OPTION_GENERIC_NO: "Избегать вступления в фракцию"
 RULE_OPTION_GENERIC_NO_DESC: "Сгенерированные ИИ страны будут избегать вступления в фракции или их создания. Однако они могут быть целью для создания фракции со стороны не-сгенерированных стран или через определённые фокусы/решения."
 RULE_OPTION_GENERIC_YES_1936: "Может участвовать как можно скорее."
 RULE_OPTION_GENERIC_YES_1936_DESC: "Может участвовать, когда будет соответствовать другим правилам."
 RULE_OPTION_GENERIC_YES_1939: "Может участвовать с 1939 года и при мировой напряжённости 50% и выше."
 RULE_OPTION_GENERIC_YES_1939_DESC: "Может участвовать после 1939 года, когда мировая напряжённость превысит 50%."
 RULE_OPTION_GENERIC_YES_1941: "Может участвовать с 1941 года и при мировой напряжённости 100% и выше."
 RULE_OPTION_GENERIC_YES_1941_DESC: "Может участвовать после 1941 года, когда мировая напряжённость достигнет 100%."
 RULE_EXILES_DEMOCRATIC_1: "Демократия союзников"
 RULE_OPTION_EXILES_DEMOCRATIC_1_SOV_AI_DESC: "Демократия будет восстановлена в России через жестокую гражданскую войну с поддержкой белого российского движения и сторонников царя. После этого ИИ Россия будет пытаться войти в альянс с Соединённым Королевством или Германской Республикой."
 RULE_EXILES_DEMOCRATIC_2: "Восточная Антанта"
 RULE_OPTION_EXILES_DEMOCRATIC_2_SOV_AI_DESC: "Демократия будет восстановлена в России через жестокую гражданскую войну с поддержкой умеренных социалистов в правительстве. После этого ИИ Россия создаст новый альянс для защиты свободных наций Евразии."
 RULE_OPTION_CHL_LE_DELUGE_2: "Новая Родина"
 RULE_OPTION_CHL_LE_DELUGE_2_DESC: "Умеренная фракция в правительстве организует переворот в Чили с поддержкой сторонников Антуана III и в конечном итоге свергнет его, установив новое правительство во главе с премьер-министром."
 RULE_OPTION_COMMUNIST_2: "Вanguardистская революция"
 RULE_OPTION_COMMUNIST_2_FRA_AI_DESC: "Вангардистская фракция левого правительства захватит власть и постарается уничтожить правый экстремизм, затем милитаризует страну для социалистической революции по всей Европе."
 RULE_OPTION_ISLAMIC_AFG_AI: "Исламская Республика"
 RULE_OPTION_ISLAMIC_AFG_DESC: "Не завершено. Будет вести себя как демократия."
 RULE_OPTION_ISLAMIC_PER_AI: "Исламская революция"
 RULE_OPTION_ISLAMIC_PER_DESCC: "Не завершено. Будет исламским, но пока не вызовет достаточно исламской революции на Ближнем Востоке. Будет добавлен оригинальный контент."
 RULE_OPTION_ISLAMIC_IRQ_AI: "Арабский ислам"
 RULE_OPTION_ISLAMIC_IRQ_DESC: "Не завершено. Будет вести себя как фашист."
 RULE_OPTION_MONARCHIST_FIN: "Монархия — Дом Гессов"
 RULE_HISTORICAL_FIN_MONARCHIST_PLAN_DESC: "Не завершено. Будет вести себя как историческое государство, будет пытаться стать монархией. Возможно, не удастся. Будет добавлен оригинальный контент в будущем."
 RULE_OPTION_COMMUNISM_PER_AI_SOVIET: "Советская Социалистическая Республика Иран"
 RULE_OPTION_COMMUNISM_PER_SOVIET_DESC: "Иран переживёт гражданскую войну с поддержкой Советского Союза, а затем присоединится к Коминтерну. Будет отменено, если Советский Союз окажется на пути к гражданской войне с Белыми."
 RULE_OPTION_HISTORICAL_ALTERNATIVE: "Сталинистский троцкизм?"
 RULE_OPTION_HISTORICAL_ALTERNATIVE_SOV_AI_DESC: "Сталин попытается быстро расширить влияние и захватить мир, потому что это весело."
 RULE_OPTION_GOE_INDIA_COMMUNISM_SOVIET: "Рабочая революция"
 RULE_OPTION_GOE_INDIA_COMMUNISM_SOVIET_RAJ_AI_DESC: "Индия сосредоточит власть в руках рабочего правительства и будет стремиться индустриализировать страну в сторону тяжёлой промышленности, предпочитая альянс с Советским Союзом или другими мировыми социалистическими экономиками."
 RULE_OPTION_GOE_INDIA_COMMUNISM_AGRARIAN: "Аграрный социализм"
 RULE_OPTION_GOE_INDIA_COMMUNISM_AGRARIAN_RAJ_AI_DESC: "Аграрные коммуны Индии захватят власть для народа и попытаются революционизировать социальную иерархию страны, прежде чем нанести решающие удары по остаткам британского владычества, одновременно стремясь к дипломатическому альянсу с азиатскими коммунистами или даже с крайне правой империалистической Японией."
 RULE_OPTION_IMPERIAL_PER_THIRD_AI: "Третья Персидская Империя"
 RULE_OPTION_IMPERIAL_PER_THIRD_DESC: "Будет осуществлено убийство Резы Шаха, после чего его сын наследует трон и попытается завоевать регион."
 PUNITIVE_ACTION_SOV: "КАРАТЕЛЬНЫЕ МЕРЫ - Советский Союз @SOV"
 PUNITIVE_ACTION_GER: "КАРАТЕЛЬНЫЕ МЕРЫ - Германия @GER"
 RULE_OPTION_PUNITIVE_ENABLED: "Включено"
 RULE_OPTION_PUNITIVE_ENABLED_SOV_DESC: "Если вы не играете по правилам, они тоже не будут."
 RULE_OPTION_PUNITIVE_ENABLED_GER_DESC: "Вызов ожидает тех, кто желает великой власти."
 RULE_OPTION_PUNITIVE_DISABLED: "Отключено"
 RULE_OPTION_PUNITIVE_DISABLED_SOV_DESC: "Ничего плохого не случится. Вы можете опробовать свои стратегии."
 RULE_OPTION_PUNITIVE_DISABLED_GER_DESC: "Плод власти падает прямо в рот."
 RULE_OPTION_FASCIST_MR_PACT: "Нечестивый альянс"
 RULE_OPTION_FASCIST_MR_PACT_GER_AI_DESC: "Германия попытается заключить альянс с Советским Союзом, чтобы бороться против западных держав. Однако ИИ перейдёт к войне с СССР, если этот план не удастся из-за различных условий, необходимых для заключения союза с Советским Союзом."
 ALLIES_MAINLAND_DEFENSE_NAME: "Стратегия союзников в континентальной Европе"
 RULE_OPTION_ALLIES_MAINLAND_DEFENSE_ENABLED: "Включено"
 RULE_OPTION_ALLIES_MAINLAND_DEFENSE_DISABLED: "Отключено"
 RULE_OPTION_ALLIES_MAINLAND_DEFENSE_ENABLED_DESC: "Союзники будут координировать действия и пытаться защитить континентальную Европу"
 RULE_OPTION_ALLIES_MAINLAND_DEFENSE_DISABLED_DESC: "Союзники будут действовать скоординировано, чтобы оставить континентальную Европу"
 USA_ENG_GUARANTEE_NAME: "Англо-американские узы"
 RULE_OPTION_USA_ENG_GUARANTEE_ENABLED: "Включено"
 RULE_OPTION_USA_ENG_GUARANTEE_DISABLED: "Отключено"
 RULE_OPTION_USA_ENG_GUARANTEE_ENABLED_DESC: "Демократические США вступят в войну на стороне демократической Великобритании при начале операции Морской лев"
 RULE_OPTION_USA_ENG_GUARANTEE_DISABLED_DESC: "Не будут вступать"
 RULE_OPTION_DEN_COMMUNIST: "Датский коммунизм"
 RULE_OPTION_DEN_COMMUNIST_AI_DESC: "ИИ Дании постарается перейти к социализму/коммунизму и создать государство всеобщего благосостояния перед тем, как искать союз против внешней угрозы. Всегда будет отвергать советский коммунизм, если только не находится в той же войне, но согласится на сближение с российской социал-демократией."
 RULE_OPTION_ROMANOV: "Последний Романов"
 RULE_ROMANOV_POL_AI_DESC: "Анастасия взойдет на польский трон. Тогда Польша, вероятно, погибнет где-то на пути к Германии или России."
 RULE_OPTION_SOVIET_COMMUNIST: "Коммунизм, ориентированный на СССР"
 RULE_SOVIET_COMMUNIST_ARG_AI_DESC: "AI Аргентина будет стремиться к коммунистической революции и присоединится к фракции, возглавляемой Советским Союзом. Однако этот путь будет заброшен, если к январю 1939 года Советский Союз не будет лидером фракции или перестанет быть коммунистическим."
 RULE_OPTION_FASCIST_SUBMISSION: "Трехсторонняя марионетка"
 RULE_FASCIST_SUBMISSION_YUG_AI_DESC: "Принц Пол захватит власть и передаст королевство иностранным державам. Путь будет отключен, если Германия перестанет быть фашистской."
 RULE_OPTION_FASCIST_KINGDOM: "Деволюционистский фашизм"
 RULE_FASCIST_KINGDOM_YUG_AI_DESC: "Югославия пройдёт через период ограниченного самоуправления, прежде чем фашизм в конечном счёте возьмёт власть над правительством и молодым Петром II"