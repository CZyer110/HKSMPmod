 country_status_events.1.t: "[Root.GetName] rises to supermajor"
 country_status_events.1.d: "Once a regional power, it is now rapidly growing its economy and already dictating global terms. Will peace hold under such conditions, and what will the other superpowers say?"
 country_status_events.1.d_major: "A state firmly written into history wants to spread its influence across the world. The global balance of power is broken, and the leading powers must now account for other nations' interests."
 country_status_events.1.a: "The world has never been so divided"

 country_status_events.2.t: "[Root.GetName] falls to major"
 country_status_events.2.d: "A global giant is stagnating and on the verge of collapse. Its rivals celebrate an economic victory, while its citizens wonder: can it get any worse?"
 country_status_events.2.d_major: "The sunset of a historic state has affected the whole world. The balance of power has changed dramatically, and parts of the former superpower are already under neighbors' influence."
 country_status_events.2.a: "Another mastodon in the shadows"

 country_status_events.3.t: "[Root.GetName] rises to major"
 country_status_events.3.d: "A small state has managed to multiply its territory, population, economy, and army in a matter of years. It now has a voice on the world stage and keeps its neighbors in fear."
 country_status_events.3.d_major: "After a crushing collapse, history repeats itself, and a new reich begins to pose an ever-greater threat. Can it reclaim its position?"
 country_status_events.3.a: "A new candidate for greatness?"

 country_status_events.4.t: "[Root.GetName] falls to minor"
 country_status_events.4.d: "A small country that had its minute of glory becomes a small and insignificant obstacle once again. Will this help it in diplomacy with other countries?"
 country_status_events.4.d_major: "No state is eternal, and the nation's people have always understood this. A former great nation, written about in every textbook in the world, will remain only in small newspaper headlines."
 country_status_events.4.a: "Another dispossessed"

