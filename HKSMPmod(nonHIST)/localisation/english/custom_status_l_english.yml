 country_status_events.1.t: "[Root.GetName] rises to supermajor"
 country_status_events.1.d: "Once a regional power, it is rapidly growing its economy and is already dictating global terms to suit itself. Will peace hold under such conditions, and what will the other superpowers say?"
 country_status_events.1.d_major: "A state firmly inscribed in history wants to spread its influence across the world. The global balance of power has been upset, and leading powers must now also consider the interests of other nations."
 country_status_events.1.a: "The world has never been so divided"

 country_status_events.2.t: "[Root.GetName] drops to major"
 country_status_events.2.d: "The global giant is stagnating and is about to collapse. Its opponents celebrate an economic victory, while its citizens wonder: can it get any worse?"
 country_status_events.2.d_major: "The decline of a historic state has affected the whole world. The balance of power has changed dramatically; parts of the former superpower are already under the influence of its neighbors."
 country_status_events.2.a: "Another behemoth in the shadows"

 country_status_events.3.t: "[Root.GetName] rises to major"
 country_status_events.3.d: "A small state has managed in a short time to multiply its territory, population, economy, and army several times over. It now has a voice on the world stage and keeps its neighbors in fear."
 country_status_events.3.d_major: "After a crushing collapse, history repeats itself, and a new Reich is beginning to pose an ever-greater threat. Will it be able to regain its position?"
 country_status_events.3.a: "A new candidate for greatness?"

 country_status_events.4.t: "[Root.GetName] drops to minor"
 country_status_events.4.d: "A small country that had its minute of glory is becoming a small and insignificant obstacle again. Will this help it in diplomacy with other countries?"
 country_status_events.4.d_major: "No state is eternal, and the people of the nation have always understood this. A former great nation written about in every world textbook will remain only in small newspaper headlines."
 country_status_events.4.a: "Another fallen one"
 
 ai_capitulate.1.t: "[From.GetName] capitulates"
 ai_capitulate.1.desc: "Without waiting for the rest"
